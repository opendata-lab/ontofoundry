[project]
name = "ontofoundry-api"
version = "0.2.3"
description = "OntoFoundry ontology modeling and serving API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jsonschema>=4.23,<5",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "alembic>=1.13,<2",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "pymysql>=1.1,<2",
  "sqlglot>=30.22.0,<31",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9", "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontofoundry_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline evaluation sets live beside the tests and are imported as `evals`.
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"src/ontofoundry_api/adapters/ossie/validator.py" = ["ALL"]
