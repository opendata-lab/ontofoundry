[project]
name = "ontofoundry-api"
version = "0.1.0"
description = "OntoFoundry ontology modeling and serving API"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "pymysql>=1.1,<2",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jsonschema>=4.23,<5",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontofoundry_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"src/ontofoundry_api/ossie/validator.py" = ["ALL"]
