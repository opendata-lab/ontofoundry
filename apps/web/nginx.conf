server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：未知路径交回 index.html，由前端路由接管，否则刷新
    # /workspaces/<id>/builder 会直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的构建产物可以长期缓存；index.html 不行，否则发布后浏览器会一直
    # 拿着旧的 HTML，引用已经不存在的 assets。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API 与文档反代到后端。上游地址来自 compose 的服务名。
    location /api/ {
        proxy_pass http://of-backend:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：agent 的事件流是长连接，缓冲会让前端拿不到增量输出。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://of-backend:8900;
    }

    location /docs {
        proxy_pass http://of-backend:8900;
    }

    location /openapi.json {
        proxy_pass http://of-backend:8900;
    }
}
