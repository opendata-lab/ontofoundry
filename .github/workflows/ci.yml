name: CI

# 验证与发布在同一个文件里，因为它们构建的是同一批镜像。拆成两个文件时，镜像
# 矩阵被抄了两份——加第四个镜像要改两处，漏一处就静默不一致。这正是把两个
# Dockerfile 合成多阶段文件时消除的那类漂移，不该在这里重新造一个。
#
# 发布相关的 job 靠 if 条件跳过：PR 上不跑，也就不需要 secrets。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.postgres && 'with PostgreSQL' || 'no database' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 两种都跑：集成测试在缺少 DATAAGENT_TEST_POSTGRES_URL 时会整体 skip，
        # 只跑带库的那次就看不出「没有库时是否仍然全绿」，只跑不带库的那次则
        # 等于从不验证真实 SQL 方言与事务边界。
        postgres: [true, false]
    services:
      # 合并之后 create_app() 会启动 DataAgent 的任务协调器，它需要 Redis。
      # 这是真实的运行依赖，不是测试脚手架：没有 Redis，提交的任务永远不会被
      # 取走执行。CI 第一次运行就是靠这一点暴露出来的——本地机器上恰好有一个
      # Redis 在跑，20 个 OntoFoundry 测试因此从未失败过。
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dataagent_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the distribution
        working-directory: apps/api
        run: uv sync --python 3.13 --all-extras --dev
      - name: Run tests
        working-directory: apps/api
        env:
          DATAAGENT_TEST_POSTGRES_URL: ${{ matrix.postgres && 'postgresql://test:test@127.0.0.1:5432/dataagent_ci' || '' }}
        run: uv run --python 3.13 pytest -q

  node:
    name: Node (runtime + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the Pi runtime
        # 后端 spawn 的是编译产物，所以构建失败等同于运行时不可用——
        # 一次未安装依赖导致的 tsc 失败已经让这套代码停滞过一轮。
        run: npm run build -w @ontofoundry/agent-runtime-pi
      - run: npm test -w @ontofoundry/agent-runtime-pi
      - run: npm test -w ontofoundry-web -- --run
      - run: npm run build -w ontofoundry-web

  images:
    name: Image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: of-backend,  dockerfile: apps/api/Dockerfile, target: backend }
          - { name: of-runner,   dockerfile: apps/api/Dockerfile, target: runner }
          - { name: of-frontend, dockerfile: apps/web/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 只有推到 main 或打 tag 时才发布。PR（含 fork 来的）走到这里会跳过，
      # 因为它们拿不到 secrets，跑了也只会红一片。
      - name: Should publish
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
             && [ "${{ github.repository }}" = "opendata-lab/ontofoundry" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tags and labels
        if: steps.gate.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/login-action@v3
        if: steps.gate.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build${{ steps.gate.outputs.publish == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          # 只在发布时做多架构：PR 上跑 arm64 要靠 qemu 模拟，慢一倍而验证不出
          # 更多东西。
          platforms: ${{ steps.gate.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.gate.outputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  offline-package:
    name: Offline package
    runs-on: ubuntu-latest
    # 默认的 GITHUB_TOKEN 是只读的，创建 release 会 403。只有这个 job 需要写，
    # 所以在 job 级别声明而不是放到 workflow 顶层。
    permissions:
      contents: write
    # 依赖镜像 job：包里装的就是它们，镜像构建不过就没有打包的意义。
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 真的执行打包脚本。此前它只是仓库里的一个文件——没有任何地方运行它，
      # 不产出 artifact，也不附到 release，所以"离线包"实际上并不存在。
      - name: Build the package
        run: ./scripts/create-offline-package.sh "$RUNNER_TEMP/offline"

      - name: Sanity check the contents
        run: |
          cd "$RUNNER_TEMP/offline"
          test -f images/ontofoundry.tar
          test -f images/infra.tar
          test -f compose.yaml
          test -f install.sh
          test -d dataagent/.claude/skills
          # 镜像 tar 应当是有内容的：save 失败也可能留下一个空文件。
          for tar in images/*.tar; do
            size=$(stat -c%s "$tar")
            [ "$size" -gt 10000000 ] || { echo "$tar 只有 $size 字节，导出多半失败了"; exit 1; }
          done
          tar -tf images/ontofoundry.tar >/dev/null

      - name: Compress
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/ontofoundry-offline.tar.gz" offline

      - uses: actions/upload-artifact@v4
        with:
          name: ontofoundry-offline
          path: ${{ runner.temp }}/ontofoundry-offline.tar.gz
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先确保 release 存在再上传。此前这里只有 upload——而 `gh release
          # upload` 对不存在的 release 直接失败，所以即便打了 tag 也传不上去。
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" \
                 --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/ontofoundry-offline.tar.gz" --clobber
