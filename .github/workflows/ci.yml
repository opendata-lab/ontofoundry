name: CI

# 验证与发布在同一个文件里，因为它们构建的是同一批镜像。拆成两个文件时，镜像
# 矩阵被抄了两份——加第四个镜像要改两处，漏一处就静默不一致。这正是把两个
# Dockerfile 合成多阶段文件时消除的那类漂移，不该在这里重新造一个。
#
# 发布相关的 job 靠 if 条件跳过：PR 上不跑，也就不需要 secrets。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    services:
      # A disposable server for the PostgreSQL integration tests: each one
      # creates and drops its own database, so the user needs CREATE DATABASE.
      # Without ONTOFOUNDRY_TEST_POSTGRES_URL those tests skip silently, which
      # is how CI ran them under a stale variable name for weeks.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ontofoundry_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the distribution
        working-directory: apps/api
        run: uv sync --python 3.13 --all-extras --dev
      - name: Run tests
        working-directory: apps/api
        env:
          ONTOFOUNDRY_TEST_POSTGRES_URL: postgresql+psycopg://test:test@127.0.0.1:5432/ontofoundry_ci
        # -rs lists every skip, so a PostgreSQL test that stops running shows up.
        run: uv run --python 3.13 pytest -q -rs

  node:
    name: Node (runtime + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -w ontofoundry-web -- --run
      - run: npm run build -w ontofoundry-web

  images:
    name: Image (${{ matrix.image.name }})
    needs: [python, node]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: of-backend,  dockerfile: apps/api/Dockerfile, target: backend }
          - { name: of-frontend, dockerfile: apps/web/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 只有推到 main 或打 tag 时才发布。PR（含 fork 来的）走到这里会跳过，
      # 因为它们拿不到 secrets，跑了也只会红一片。
      - name: Should publish
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ] \
             && [ "${{ github.repository }}" = "opendata-lab/ontofoundry" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tags and labels
        if: steps.gate.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image.name }}
          # latest 跟随 main；正式版本标签不覆盖这个滚动入口。
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        if: steps.gate.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build${{ steps.gate.outputs.publish == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          # 只在发布时做多架构：PR 上跑 arm64 要靠 qemu 模拟，慢一倍而验证不出
          # 更多东西。
          platforms: ${{ steps.gate.outputs.publish == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.gate.outputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  offline-package:
    name: Offline package
    # main、版本标签和手动运行照常打包；PR 只验证代码和镜像。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 不同分支/标签的安装包串行更新，避免互相删除刚上传的产物。
    concurrency:
      group: offline-package
      cancel-in-progress: false
    # 默认的 GITHUB_TOKEN 是只读的，创建 release 会 403。只有这个 job 需要写，
    # 所以在 job 级别声明而不是放到 workflow 顶层。
    permissions:
      contents: write
      actions: write
    # 依赖镜像 job：包里装的就是它们，镜像构建不过就没有打包的意义。
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 真的执行打包脚本。此前它只是仓库里的一个文件——没有任何地方运行它，
      # 不产出 artifact，也不附到 release，所以"离线包"实际上并不存在。
      - name: Build the package
        run: ./scripts/create-offline-package.sh "$RUNNER_TEMP/offline"

      - name: Sanity check the contents
        run: |
          cd "$RUNNER_TEMP/offline"
          test -f images/ontofoundry.tar
          test -f images/infra.tar
          test -f compose.yaml
          test -f install.sh
          test ! -e integrations
          if grep -i dataagent compose.yaml .env.example README.md install.sh; then
            echo "离线包元数据不应包含 DataAgent 配置或说明"
            exit 1
          fi
          # 镜像 tar 应当是有内容的：save 失败也可能留下一个空文件。
          for tar in images/*.tar; do
            size=$(stat -c%s "$tar")
            [ "$size" -gt 10000000 ] || { echo "$tar 只有 $size 字节，导出多半失败了"; exit 1; }
          done
          tar -tf images/ontofoundry.tar >/dev/null

      - name: Compress
        run: |
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/ontofoundry-offline.tar.gz" offline
          cd "$RUNNER_TEMP"
          sha256sum ontofoundry-offline.tar.gz > ontofoundry-offline.tar.gz.sha256

      # Release 附件不占 Actions artifact 额度；新包先发布到长期下载入口。
      - name: Publish latest package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
        run: ./scripts/publish-latest-release.sh "$RUNNER_TEMP/ontofoundry-offline.tar.gz"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" \
                 --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/ontofoundry-offline.tar.gz" \
            "$RUNNER_TEMP/ontofoundry-offline.tar.gz.sha256" --clobber

      - name: Upload the package
        id: offline-upload
        uses: actions/upload-artifact@v4
        with:
          name: ontofoundry-offline
          path: ${{ runner.temp }}/ontofoundry-offline.tar.gz
          retention-days: 14
          if-no-files-found: error

      # 上传成功后才轮换；构建或上传失败时，旧包仍可下载。
      - name: Remove previous offline packages
        uses: actions/github-script@v7
        env:
          KEEP_ARTIFACT_ID: ${{ steps.offline-upload.outputs.artifact-id }}
        with:
          script: |
            const keepId = Number(process.env.KEEP_ARTIFACT_ID);
            if (!Number.isSafeInteger(keepId) || keepId <= 0) {
              throw new Error('Missing uploaded artifact ID; refusing cleanup');
            }
            const repo = context.repo;
            const { data: current } = await github.rest.actions.getArtifact({
              ...repo, artifact_id: keepId,
            });
            if (current.name !== 'ontofoundry-offline' || current.expired) {
              throw new Error('Uploaded package unavailable; refusing cleanup');
            }
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { ...repo, per_page: 100 },
            );
            for (const artifact of artifacts) {
              if (artifact.name !== current.name || artifact.id === keepId) continue;
              try {
                await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
                core.info(`Deleted previous package ${artifact.id}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
