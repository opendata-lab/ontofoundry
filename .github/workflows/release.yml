name: Release

# 发布到 Docker Hub。与 ci.yml 分开：CI 回答「能不能构建、能不能跑过」，
# 对每个 PR 都要跑且不需要凭据；这里只在 main 和 tag 上跑，需要 secrets。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # fork 发来的 PR 拿不到 secrets，跑了也只会红一片。
    if: github.repository == 'opendata-lab/ontofoundry'
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: of-backend,  dockerfile: apps/api/Dockerfile, target: backend }
          - { name: of-runner,   dockerfile: apps/api/Dockerfile, target: runner }
          - { name: of-frontend, dockerfile: apps/web/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 与 ci.yml 分开 scope：两条流水线构建的是同一份内容，但 CI 是单平台、
          # 这里是多平台，共用缓存会互相污染。
          cache-from: type=gha,scope=release-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image.name }}
