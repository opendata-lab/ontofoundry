# Docker's own log is a short buffer for `docker compose logs`; the history
# lives in ./logs/<service>/ (one-line JSON, rotated daily, kept 30 days),
# see docs/design/2026-11-19-logging-standard.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:17-alpine
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_DB: ontofoundry
      POSTGRES_USER: ontofoundry
      POSTGRES_PASSWORD: ontofoundry
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontofoundry -d ontofoundry"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ontofoundry-postgres:/var/lib/postgresql/data

  of-backend:
    logging: *default-logging
    image: ${OF_BACKEND_IMAGE:-of-backend:local}
    environment:
      ONTOFOUNDRY_ENVIRONMENT: ${ONTOFOUNDRY_ENVIRONMENT:-development}
      ONTOFOUNDRY_AUTH_MODE: ${ONTOFOUNDRY_AUTH_MODE:-login}
      ONTOFOUNDRY_AUTH_CONFIG: /opt/ontofoundry-api/docker/ontofoundry/ontofoundry_config.py
      ONTOFOUNDRY_SESSION_SECRET: ${ONTOFOUNDRY_SESSION_SECRET:-development-only-session-secret-change-me}
      ONTOFOUNDRY_COOKIE_SECURE: ${ONTOFOUNDRY_COOKIE_SECURE:-false}
      ONTOFOUNDRY_SEED_DEMO: ${ONTOFOUNDRY_SEED_DEMO:-false}
      ONTOFOUNDRY_DATABASE_URL: postgresql+psycopg://ontofoundry:ontofoundry@postgres:5432/ontofoundry
      # Uploaded material and import artifacts are local files; keep them on a
      # named volume so recreating the container does not orphan material rows.
      ONTOFOUNDRY_DATA_DIR: /var/lib/ontofoundry/files
      ONTOFOUNDRY_LOG_DIR: /var/log/of-backend
      ONTOFOUNDRY_LOG_LEVEL: ${ONTOFOUNDRY_LOG_LEVEL:-INFO}
      ONTOFOUNDRY_CORS_ORIGINS: ${ONTOFOUNDRY_CORS_ORIGINS:-}
      ONTOFOUNDRY_PUBLIC_BASE_URL: ${ONTOFOUNDRY_PUBLIC_BASE_URL:-}
      ONTOFOUNDRY_DATAAGENT_BASE_URL: ${ONTOFOUNDRY_DATAAGENT_BASE_URL:-}
      ONTOFOUNDRY_DATAAGENT_API_PREFIX: ${ONTOFOUNDRY_DATAAGENT_API_PREFIX:-/api/v1/nl2sql}
      ONTOFOUNDRY_DATAAGENT_WEBSITE_ID: ${ONTOFOUNDRY_DATAAGENT_WEBSITE_ID:-ontofoundry}
      ONTOFOUNDRY_DATAAGENT_AGENT_ID: ${ONTOFOUNDRY_DATAAGENT_AGENT_ID:-agent_ontofoundry}
      ONTOFOUNDRY_MCP_TOKEN: ${ONTOFOUNDRY_MCP_TOKEN-ontofoundry-mcp-default-token}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8910:8900"
    volumes:
      - ontofoundry-data:/var/lib/ontofoundry/files
      - ./logs/of-backend:/var/log/of-backend
      - ./deploy/docker/ontofoundry:/opt/ontofoundry-api/docker/ontofoundry:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 20

  of-frontend:
    logging: *default-logging
    image: ${OF_FRONTEND_IMAGE:-of-frontend:local}
    depends_on:
      of-backend:
        condition: service_healthy
    ports:
      # 对外只开放前端：浏览器通过 http://<服务器IP>:8010 访问，API 走同源 /api 反代。
      - "${OF_HTTP_PORT:-8010}:80"

volumes:
  ontofoundry-postgres:
  ontofoundry-data:
