services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ontofoundry
      POSTGRES_USER: ontofoundry
      POSTGRES_PASSWORD: ontofoundry
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontofoundry -d ontofoundry"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ontofoundry-postgres:/var/lib/postgresql/data

  of-backend:
    image: ${OF_BACKEND_IMAGE:-of-backend:local}
    environment:
      ONTOFOUNDRY_DATABASE_URL: postgresql+psycopg://ontofoundry:ontofoundry@postgres:5432/ontofoundry
      ONTOFOUNDRY_CORS_ORIGINS: ${ONTOFOUNDRY_CORS_ORIGINS:-}
      ONTOFOUNDRY_PUBLIC_BASE_URL: ${ONTOFOUNDRY_PUBLIC_BASE_URL:-}
      ONTOFOUNDRY_DATAAGENT_BASE_URL: ${ONTOFOUNDRY_DATAAGENT_BASE_URL:-}
      ONTOFOUNDRY_DATAAGENT_API_PREFIX: ${ONTOFOUNDRY_DATAAGENT_API_PREFIX:-/api/v1/nl2sql}
      ONTOFOUNDRY_DATAAGENT_WEBSITE_ID: ${ONTOFOUNDRY_DATAAGENT_WEBSITE_ID:-ontofoundry}
      ONTOFOUNDRY_DATAAGENT_ACCESS_KEY: ${ONTOFOUNDRY_DATAAGENT_ACCESS_KEY:-}
      ONTOFOUNDRY_DATAAGENT_AGENT_ID: ${ONTOFOUNDRY_DATAAGENT_AGENT_ID:-agent_ontofoundry}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8900:8900"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 20

  of-frontend:
    image: ${OF_FRONTEND_IMAGE:-of-frontend:local}
    depends_on:
      of-backend:
        condition: service_healthy
    ports:
      # 对外只开放前端：浏览器通过 http://<服务器IP>:8080 访问，API 走同源 /api 反代。
      - "${OF_HTTP_PORT:-8080}:80"

volumes:
  ontofoundry-postgres:
