function renderAssets(){const rows=D.datasets.filter(d=>[d.source,...sourceColumns(d.id)].join(' ').toLowerCase().includes(S.assetQuery.toLowerCase()));$('#asset-results').innerHTML=`<table class="assets-table"><thead><tr><th>表</th><th>映射对象</th><th>${S.draft?'选择':'字段'}</th></tr></thead><tbody>${rows.map(d=>{const objects=[...records.values()].filter(r=>summary(r).tables.includes(d.id));return `<tr><td data-label="表"><code>${esc(d.source)}</code><small class="sub">${esc(D.semantic_models[0].map_name)}</small></td><td data-label="映射对象">${objects.map(r=>`<button class="link" data-open="${r.object.id}" data-entry="mapping">${esc(shortName(r.object))}</button>`).join(' · ')||'<span class="muted">—</span>'}</td><td data-label="${S.draft?'选择':'字段'}">${S.draft?`<button class="btn text" data-select-table="${d.id}">选用</button>`:remember('字段',sourceColumns(d.id).map(c=>`<div class="entry"><code>${esc(c)}</code></div>`).join(''))}</td></tr>`}).join('')||'<tr><td colspan="3" class="blank">没有匹配的表</td></tr>'}</tbody></table>`}
function rawTree(ns){function branch(n){return `<details ${n.parent_id?'':'open'}><summary>${esc(n.relationship||n.slot)}${n.expression?' · '+esc(n.expression):''}</summary><pre>${esc(JSON.stringify(n,null,2))}</pre>${descendants(ns,n.id).map(branch).join('')}</details>`}return ns.filter(n=>!n.parent_id).map(branch).join('')}
function openAdvanced(){const r=$('#inspector').open?active():null,ns=r?rawForRecord(r):D.mapping_nodes;$('#advanced').innerHTML=`<div class="dialog-layout"><header class="detail-head"><h2 id="advanced-title">高级</h2><span class="pill">只读</span><button class="icon-btn push" data-close="advanced" aria-label="关闭高级">${icon('close')}</button></header><div class="detail-content"><div class="raw-meta"><div><label>语义模型 · 唯一选项，已默认</label><code>${esc(D.semantic_models[0].name)}</code></div><div><label>连接</label><code>${esc(D.semantic_models[0].map_name)}</code></div>${r?`<div><label>概念映射 ID</label><code>${esc(cmFor(r.object.id)?.id||'保存后生成')}</code></div>`:''}</div><details><summary>数据集与字段</summary><pre style="margin-top:12px">${esc(JSON.stringify({datasets:D.datasets,dataset_fields:D.dataset_fields,dataset_relationships:D.dataset_relationships},null,2))}</pre></details><details open style="margin-top:24px"><summary>原生映射 · ${r?esc(shortName(r.object)): '全部对象'} · ${ns.length} 节点</summary><div class="flex" style="margin:14px 0"><span class="muted">映射树</span><button class="btn text" data-action="raw-expand">展开全部</button><button class="btn text" data-action="raw-collapse">收起全部</button></div><div class="raw-tree">${rawTree(ns)||'<span class="muted">无映射节点</span>'}</div></details><details style="margin-top:24px"><summary>原始快照 / 来源证据</summary><pre style="margin-top:12px">${esc(JSON.stringify(r?{object:r.object,properties:r.props.map(({entries,...p})=>p),rules:r.rules,legacy:D.legacy_mapping_form.mappings.find(x=>x.type_id===r.object.id)}:{semantic_models:D.semantic_models,concept_mappings:D.concept_mappings,legacy_mapping_form:D.legacy_mapping_form},null,2))}</pre></details></div></div>`;$('#advanced').showModal()}
let sequence=0;
function rawForRecord(r){const ns=clone(nodesFor(r.object.id)),cm=cmFor(r.object.id);const newId=()=>`prototype-${++sequence}`;let root=ns.find(n=>n.slot==='object_mappings');const key=summaryKey(r);if(key.length&&key[0].expr&&!key[0].pending){if(root){if(key.length===1){const previous=root.expression,next=nativeValue(key[0]);root.expression=next;if(previous&&previous!==next)for(const source of ns.filter(n=>n.kind==='object'&&n.slot==='object_mapping'&&!n.concept&&n.expression===previous))source.expression=next;if(!r.keyComposite){const remove=new Set(referents(ns,root).map(n=>n.id));for(let i=ns.length-1;i>=0;i--)if(remove.has(ns[i].id))ns.splice(i,1)}}else for(const e of key){const part=ns.find(n=>n.id===e.nodeId);if(part)part.expression=nativeValue(e)}}else{root={id:newId(),kind:'object',slot:'object_mappings',parent_id:null,expression:nativeValue(key[0]),position:0,concept_mapping_id:cm?.id||'prototype-'+r.object.id};ns.push(root)}}for(const p of r.props){for(const e of p.entries){if(e.pending)continue;const n=ns.find(n=>n.id===e.nodeId);if(n){n.expression=nativeValue(e);continue}if(!e.expr||(!e.ds&&fieldMode(e)!=='constant'))continue;let host=ns.find(n=>n.kind==='link'&&n.parent_id===null&&child(ns,n)?.expression===nativeValue(key[0]||e));if(!host){host={id:newId(),kind:'link',slot:'link_mappings',parent_id:null,position:ns.filter(n=>!n.parent_id).length,concept_mapping_id:cm?.id||'prototype-'+r.object.id};ns.push(host,{id:newId(),kind:'object',slot:'object_mapping',parent_id:host.id,expression:nativeValue(key[0]||e),position:0,concept_mapping_id:host.concept_mapping_id})}const link={id:newId(),kind:'link',slot:'children',parent_id:host.id,relationship:p.technical_name,position:descendants(ns,host.id,'children').length,concept_mapping_id:host.concept_mapping_id};ns.push(link,{id:newId(),kind:'object',slot:'object_mapping',parent_id:link.id,concept:{kind:'builtin',ref:p.roles?.[0]?.concept?.ref||'String'},expression:nativeValue(e),position:0,concept_mapping_id:host.concept_mapping_id})}}for(const rel of r.relations.filter(x=>!x.incoming)){for(const b of rel.branches){if(b.isNew){const host={id:newId(),kind:'link',slot:'link_mappings',parent_id:null,position:ns.filter(n=>!n.parent_id).length,concept_mapping_id:cm?.id||'prototype-'+r.object.id};ns.push(host,{id:newId(),kind:'object',slot:'object_mapping',parent_id:host.id,expression:nativeValue(b.source[0]),position:0,concept_mapping_id:host.concept_mapping_id});let prev=host;for(let ri=0;ri<b.roles.length;ri++){const role=b.roles[ri],terminal=ri===b.roles.length-1,ln={id:newId(),kind:'link',slot:'children',parent_id:prev.id,relationship:terminal?rel.def.technical_name:null,position:0,concept_mapping_id:host.concept_mapping_id};const ob={id:newId(),kind:'object',slot:'object_mapping',parent_id:ln.id,concept:{ref:role.object,kind:role.kind},expression:role.parts.length===1?nativeValue(role.parts[0]):null,position:0,concept_mapping_id:host.concept_mapping_id};ns.push(ln,ob);if(role.parts.length>1)role.parts.forEach((e,i)=>ns.push({id:newId(),kind:'referent',slot:'referent_mappings',parent_id:ob.id,relationship:e.label,expression:nativeValue(e),position:i,concept_mapping_id:host.concept_mapping_id}));prev=ln}}else for(const e of [...b.source,...b.roles.flatMap(x=>x.parts)]){const n=ns.find(n=>n.id===e.nodeId);if(n)n.expression=nativeValue(e)}}}return ns}
function validateSave(r){if(!r.object.name.trim())return '请填写名称。';if(!/^[A-Za-z_]\w*$/.test(r.object.technical_name))return '英文名须使用字母、数字和下划线，以字母或下划线开头。';if([...records.values()].some(x=>x.object.id!==r.object.id&&x.object.technical_name===r.object.technical_name))return '英文名已被其他对象使用。';const key=r.props.find(p=>p.id===r.keyProp);if(r.props.some(mapped)&&!r.keyComposite&&!key?.entries.some(e=>!e.pending&&validation(e).kind==='good'))return '请在已映射的属性行标记实例标识。';for(const p of r.props)for(const e of p.entries){const v=validation(e);if(v.kind==='bad')return p.name+'：'+v.text}for(const rel of r.relations.filter(x=>!x.incoming))for(const b of rel.branches){for(const e of [...b.source,...b.roles.flatMap(x=>x.parts)]){if(!e.expr)return '关系「'+(relationNames[rel.def.technical_name]||rel.def.name)+'」有空字段。';if(validation(e).kind==='bad')return '关系字段：'+validation(e).text}}return ''}
function save(){const r=S.draft,error=validateSave(r);if(error){$('#save-error').textContent=error;return}const keyProperty=r.props.find(p=>p.id===r.keyProp);if(keyProperty)r.object.identify_by=[keyProperty.technical_name];const ns=rawForRecord(r);let cm=cmFor(r.object.id);if(!cm&&ns.length){cm={id:'prototype-'+r.object.id,concept_id:{ref:r.object.id,kind:'object_type'},semantic_model_id:D.semantic_models[0].id,position:D.concept_mappings.length};D.concept_mappings.push(cm)}if(cm){ns.forEach(n=>n.concept_mapping_id=cm.id);D.mapping_nodes=D.mapping_nodes.filter(n=>n.concept_mapping_id!==cm.id).concat(ns)}const o=objById.get(r.object.id);Object.assign(o,clone(r.object));r.keys=summaryKey(r).map(clone);const refreshed=recordFor(o);refreshed.rules=clone(r.rules);refreshed.props.forEach(p=>{const d=r.props.find(x=>x.id===p.id);if(d)p.required=d.required});records.set(r.object.id,refreshed);for(const [id,other] of records)other.relations=relationsFor(id);S.draft=null;S.savedCount++;renderPage();renderInspector();$('#inspector [role=tab][aria-selected=true]')?.focus({preventScroll:true})}
function startEdit(){S.draft=clone(records.get(S.id));renderInspector();$('#object-panel input, #object-panel select, #object-panel button')?.focus({preventScroll:true})}
function cancelEdit(){S.draft=null;renderInspector()}
function closeObject(){const discarded=!!S.draft;S.draft=null;$('#inspector').close();if(discarded)notify('草稿已取消')}
function selectedEntry(pid,i){const p=ensureEntries(pid);return p.entries[i]}
function matchFields(){const r=S.draft;if(!r.mainDs){openAssets();return}let count=0;for(const p of r.props){if(mapped(p))continue;const f=fieldsFor(r.mainDs).find(f=>f.name===p.technical_name||sql(f)===p.technical_name);if(f){p.entries=[entry(`${dsById.get(r.mainDs).name}.${f.name}`)];count++}}renderTab();notify(count?'已匹配 '+count+' 个属性':'没有同名字段；可逐行选择字段')}
function checkCycle(parent,id){let cur=parent;const seen=new Set([id]);while(cur){if(seen.has(cur))return true;seen.add(cur);cur=records.get(cur)?.object.extends?.[0]?.ref}return false}
function rebuildDraftInheritance(parent){const r=S.draft,local=r.props.filter(p=>!p.inherited),old=new Map(r.props.map(p=>[p.id,p]));r.object.extends=parent?[{ref:parent,kind:'object_type'}]:[];r.props=[...local,...(parent?inheritedProps(parent):[]).filter(p=>!local.some(x=>x.technical_name===p.technical_name)).map(p=>old.get(p.id)||{...clone(p),inherited:true,entries:[]})];if(!r.props.some(p=>p.id===r.keyProp))r.keyProp=r.props.find(p=>p.identifier)?.id||''}
async function copyLink(btn){const url=location.href.split('#')[0]+'#object='+encodeURIComponent(active().object.technical_name)+'&tab='+S.tab;try{await navigator.clipboard.writeText(url);btn.innerHTML=icon('check')+'已复制';setTimeout(()=>{if(btn.isConnected)btn.innerHTML=icon('link')+'复制链接'},2200)}catch{showDetail('复制链接',`<label class="field"><span>对象链接</span><input id="copy-value" readonly value="${esc(url)}"></label>`);$('#copy-value').focus();$('#copy-value').select()}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-open]');if(!b)return;if(b.dataset.info){openInfo(b.dataset.info);return}if(b.dataset.close){$('#'+b.dataset.close).close();return}if(b.dataset.page){S.page=b.dataset.page;renderPage();return}if(b.dataset.filter){S.filter=b.dataset.filter;renderPage();return}if(b.dataset.open){if($('#detail').open)$('#detail').close();openObject(b.dataset.open,b.dataset.entry==='mapping'||(S.page==='mapping'&&!$('#inspector').open)?'properties':'overview');return}if(b.dataset.tab){S.tab=b.dataset.tab;renderInspector();$('#tab-'+S.tab)?.focus({preventScroll:true});return}if(b.dataset.key&&S.draft){S.draft.keyProp=b.dataset.key;S.draft.keyComposite=false;renderTab();return}if(b.dataset.expression){editExpression(b.dataset.expression,+b.dataset.index);return}if(b.dataset.relation){openRelation(b.dataset.relation);return}if(b.dataset.addSource&&S.draft){ensureEntries(b.dataset.addSource).entries.push(entry('',null,S.draft.mainDs));renderTab();return}if(b.dataset.selectTable&&S.draft){const r=S.draft,ds=b.dataset.selectTable,previous=r.mainDs;r.mainDs=ds;for(const p of r.props){if(!p.entries.length)p.entries=[entry('',null,ds)];else for(const ent of p.entries)if(!ent.ds||(ent.ds===previous&&ds!==previous)){ent.ds=ds;ent.expr='';ent.value='';ent.pending=false}}$('#assets').close();renderInspector();return}const a=b.dataset.action;if(a==='edit')startEdit();if(a==='cancel-edit')cancelEdit();if(a==='save')save();if(a==='close-object')closeObject();if(a==='expand'){S.expanded=!S.expanded;$('#inspector').classList.toggle('expanded',S.expanded);b.setAttribute('aria-label',S.expanded?'还原弹窗':'展开弹窗')}if(a==='copy-link')copyLink(b);if(a==='advanced')openAdvanced();if(a==='pick-table')openAssets();if(a==='match-fields')matchFields();if(a==='reset-search'){S.query='';S.filter='all';renderPage()}if(a==='apply-expression'){const c=S.detailContext,ent=selectedEntry(c.pid,c.index);ent.expr=$('#expanded-expression').value.trim();ent.mode='expression';ent.pending=false;ent.value=nativeValue(ent);$('#detail').close();renderTab()}if(a==='apply-relation'){const c=S.detailContext;const i=S.draft.relations.findIndex(x=>x.def.id===c.rel.def.id);S.draft.relations[i]=clone(c.rel);$('#detail').close();renderTab()}if(a==='edit-relation-owner'){$('#detail').close();openObject(b.dataset.owner,'relations');startEdit()}if(a==='new-relation'){const c=S.detailContext,rel=c.rel,r=active();const source=summaryKey(r);const newEntry=id=>{const target=records.get(id);return target&&summaryKey(target)[0]?{...clone(summaryKey(target)[0]),nodeId:null,label:'标识'}:{...entry('',null,r.mainDs),label:'字段'}};rel.branches=[{id:'new',isNew:true,source:[source[0]?{...clone(source[0]),nodeId:null,label:'标识'}:newEntry(r.object.id)],roles:rel.def.roles.map(role=>({name:role.name||shortName(objById.get(role.concept.ref)||{name:role.concept.ref}),object:role.concept.ref,kind:role.concept.kind,parts:[role.concept.kind==='object_type'?newEntry(role.concept.ref):{...entry('',null,r.mainDs),label:role.name||'字段'}]}))}];renderRelationDetail()}if(a==='raw-expand'||a==='raw-collapse')for(const d of $('#advanced').querySelectorAll('.raw-tree details'))d.open=a==='raw-expand'});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='page-search'){S.query=t.value;renderPageRows()}if(t.id==='asset-search'){S.assetQuery=t.value;renderAssets()}if(t.id==='property-search'){const pos=t.selectionStart;S.propertyQuery=t.value;renderTab();$('#property-search')?.focus();$('#property-search')?.setSelectionRange(pos,pos)}if(t.id==='relation-search'){const pos=t.selectionStart;S.relationQuery=t.value;renderTab();$('#relation-search')?.focus();$('#relation-search')?.setSelectionRange(pos,pos)}if(!S.draft)return;if(t.dataset.objectField&&t.dataset.objectField!=='parent'){let value=t.value;if(t.dataset.objectField==='description'){const aliases=records.get(S.id).object.description?.match(/别名：(.+)$/)?.[1];if(aliases&&!value.includes('别名：'))value+=' 别名：'+aliases}S.draft.object[t.dataset.objectField]=value;}if(t.dataset.mapExpr){const ent=selectedEntry(t.dataset.mapExpr,+t.dataset.index);ent.expr=t.value;ent.value=nativeValue(ent);ent.pending=false}if(t.dataset.rule!==undefined){const rule=S.draft.rules[+t.dataset.rule];rule.condition=t.value;if(!rule.source.startsWith('本次会话编辑'))rule.source='本次会话编辑；原始来源：'+rule.source;}if(t.dataset.roleExpr){const ent=relationEntry(...t.dataset.roleExpr.split(':').map(Number));ent.expr=t.value;ent.value=nativeValue(ent);ent.pending=false}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='branch-picker'){S.detailContext.branch=+t.value;renderRelationDetail();return}if(!S.draft)return;let update=false;if(t.dataset.mapTable){const ent=selectedEntry(t.dataset.mapTable,+t.dataset.index);ent.ds=t.value;ent.expr='';ent.value='';ent.pending=false;if(!S.draft.mainDs)S.draft.mainDs=t.value;update=true}if(t.dataset.mapField){const ent=selectedEntry(t.dataset.mapField,+t.dataset.index);ent.expr=t.value;ent.pending=false;ent.value=nativeValue(ent);update=true}if(t.dataset.mapMode){const ent=selectedEntry(t.dataset.mapMode,+t.dataset.index);ent.mode=t.value;if(ent.mode==='field'&&!sourceColumns(ent.ds).includes(ent.expr)){ent.expr='';ent.value=''}if(ent.mode==='constant'){if(!isLiteral(ent.expr))ent.expr='';ent.ds='';ent.value=nativeValue(ent)}update=true}if(t.dataset.required){const p=S.draft.props.find(p=>p.id===t.dataset.required);p.required=t.checked}if(t.dataset.objectField==='parent'){if(checkCycle(t.value,S.id)){notify('不能循环继承');t.value=S.draft.object.extends?.[0]?.ref||'';return}rebuildDraftInheritance(t.value);update=true}let roleUpdate=false;for(const kind of ['Table','Field','Mode']){const key=t.dataset['role'+kind];if(!key)continue;const ent=relationEntry(...key.split(':').map(Number));if(kind==='Table'){ent.ds=t.value;ent.expr=''}if(kind==='Field')ent.expr=t.value;if(kind==='Mode'){ent.mode=t.value;if(ent.mode==='field'&&!sourceColumns(ent.ds).includes(ent.expr))ent.expr='';if(ent.mode==='constant'){if(!isLiteral(ent.expr))ent.expr='';ent.ds=''}}ent.pending=false;ent.value=nativeValue(ent);roleUpdate=true}if(roleUpdate)renderRelationDetail();if(update)renderTab()});
for(const dlg of document.querySelectorAll('dialog')){dlg.addEventListener('click',e=>{if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(dlg.id==='inspector')closeObject();else dlg.close()}})}
$('#inspector').addEventListener('cancel',e=>{e.preventDefault();closeObject()});$('#detail').addEventListener('close',()=>S.detailContext=null);$('#browse-tables').addEventListener('click',()=>openAssets());$('#advanced-page').addEventListener('click',openAdvanced);
document.addEventListener('keydown',e=>{const tab=e.target.closest('[role=tab]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const a=tabs(active()),i=a.findIndex(x=>x[0]===S.tab);S.tab=a[e.key==='Home'?0:e.key==='End'?a.length-1:(i+(e.key==='ArrowRight'?1:-1)+a.length)%a.length][0];renderInspector();$('#tab-'+S.tab).focus({preventScroll:true})});
function fromHash(){const p=new URLSearchParams(location.hash.slice(1)),o=D.object_types.find(o=>o.technical_name===p.get('object'));if(o)openObject(o.id,['overview','properties','relations','rules','instances'].includes(p.get('tab'))?p.get('tab'):'overview');return !!o}
renderPage();if(!fromHash())openObject(D.object_types.find(o=>o.technical_name==='system').id,'overview');window.addEventListener('hashchange',fromHash);
</script>
