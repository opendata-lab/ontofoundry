<script id="source-data" type="application/json">{"version":"0.2.0.dev0","name":"architecture_governance","description":"架构治理领域的 Apache Ossie 本体、逻辑语义模型与标准映射。","ai_context":{"synonyms":["架构治理语义","架构问数"]},"ontology":[{"concept":"component","type":"EntityType","description":"逻辑组件；同名组件在 DEV/TEST/PROD 中是同一组件，环境和快照只是上下文。 别名：组件、服务、应用组件、微服务组件。","identify_by":["component_name"],"relationships":[{"name":"component_name","verbalizes":["{component} 名称是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"OneToOne"},{"name":"component_name_cn","verbalizes":["{component} 中文名称是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"ManyToOne"},{"name":"component_type","verbalizes":["{component} 资产类型是 {String:component_type}"],"roles":[{"concept":"String","name":"component_type"}],"multiplicity":"ManyToOne","requires":["component_type IN ('FRONTEND', 'BACKEND', 'MIDDLEWARE', 'DB', 'SDK')"]},{"name":"architecture_type","verbalizes":["{component} 架构类型是 {String:architecture_type}"],"roles":[{"concept":"String","name":"architecture_type"}],"multiplicity":"ManyToOne"},{"name":"business_importance_label","description":"组件业务重要性原始标签；保留源数据代码，不直接等同于核心/非核心分类。","verbalizes":["{component} 业务重要性标签是 {String:business_importance_label}"],"roles":[{"concept":"String","name":"business_importance_label"}],"multiplicity":"ManyToOne"},{"name":"is_core","description":"由业务重要性标签归一化得到的核心标记：core、opt 为 Y；base、external 和空标签不分类；其他非空标签为 N。","verbalizes":["{component} 核心标记是 {String:is_core}"],"roles":[{"concept":"String","name":"is_core"}],"multiplicity":"ManyToOne","requires":["is_core IN ('Y', 'N')"]},{"name":"system_level","verbalizes":["{component} 保障等级是 {String:system_level}"],"roles":[{"concept":"String","name":"system_level"}],"multiplicity":"ManyToOne","requires":["system_level IN ('1', '2', '3', '4')"]},{"name":"belongs_to_system","verbalizes":["{component} 属于 {system}"],"roles":[{"concept":"system"}],"multiplicity":"ManyToOne","description":"组件所属的业务系统；用于查询组件属于哪个系统以及系统下的组件。"},{"name":"belongs_to_department","verbalizes":["{component} 属于 {department}"],"roles":[{"concept":"department"}],"multiplicity":"ManyToOne","description":"组件所属的业务部门；用于查询组件归属部门以及部门下的组件。"},{"name":"runs_in","verbalizes":["{component} 运行于 {environment}"],"roles":[{"concept":"environment"}],"multiplicity":"ManyToOne","description":"组件运行所在的逻辑环境；用于应用默认环境或环境筛选。"},{"name":"located_in","verbalizes":["{component} 位于 {zone}"],"roles":[{"concept":"zone"}],"multiplicity":"ManyToOne","description":"组件所在的部署区域或可用区；用于按区域查询组件。"},{"name":"declares_dependency_on","verbalizes":["{component} 声明依赖 {component:dependency}"],"roles":[{"concept":"component","name":"dependency"}],"description":"组件声明依赖的另一组件；表示静态依赖导航，不包含调用次数或滚动窗口。"},{"name":"call_observation","verbalizes":["{component} 在 {environment:observed_environment} 环境截至 {Date:window_end} 的 {String:window} 窗口内调用 {component:called_component} 共 {Integer:call_count} 次，最近调用时间为 {DateTime:observed_at}"],"roles":[{"concept":"component","name":"called_component"},{"concept":"environment","name":"observed_environment"},{"concept":"Date","name":"window_end"},{"concept":"String","name":"window"},{"concept":"DateTime","name":"observed_at"},{"concept":"Integer","name":"call_count"}],"requires":["window IN ('1m', '3m', '6m', '1y')"],"description":"组件调用下游组件的滚动窗口事实；环境、窗口结束日和周期共同限定事实粒度。"},{"name":"owns_interface","verbalizes":["{component} 拥有 {api_interface}"],"roles":[{"concept":"api_interface"}],"multiplicity":"ManyToOne","derived_by":["api_interface.owner(component)"],"description":"api_interface.owner 的反向关系，用于从组件导航到其拥有的接口。"},{"name":"database_access_observation","verbalizes":["{component} 在 {environment:observed_environment} 环境截至 {Date:window_end} 的 {String:window} 窗口内访问 {database_schema:accessed_schema} 共 {Integer:call_count} 次"],"roles":[{"concept":"database_schema","name":"accessed_schema"},{"concept":"environment","name":"observed_environment"},{"concept":"Date","name":"window_end"},{"concept":"String","name":"window"},{"concept":"Integer","name":"call_count"}],"requires":["window IN ('1m', '3m', '6m', '1y')"],"description":"组件访问数据库 Schema 的滚动窗口事实。"},{"name":"table_call_observation","verbalizes":["{component} 在 {environment:observed_environment} 环境截至 {Date:window_end} 的 {String:window} 窗口内调用 {table_asset:called_table} 共 {Integer:call_count} 次"],"roles":[{"concept":"table_asset","name":"called_table"},{"concept":"environment","name":"observed_environment"},{"concept":"Date","name":"window_end"},{"concept":"String","name":"window"},{"concept":"Integer","name":"call_count"}],"requires":["window IN ('1m', '3m', '6m', '1y')"],"description":"组件调用数据库表的滚动窗口事实。"},{"name":"direct_kafka_producer_observation","verbalizes":["{component} 在 {environment:observed_environment} 环境截至 {Date:window_end} 的 {String:window} 窗口内直接生产 {kafka_topic:topic} 共 {Integer:call_count} 次，直接生产标识为 {Boolean:is_real}"],"roles":[{"concept":"kafka_topic","name":"topic"},{"concept":"environment","name":"observed_environment"},{"concept":"Date","name":"window_end"},{"concept":"String","name":"window"},{"concept":"Integer","name":"call_count"},{"concept":"Boolean","name":"is_real"}],"requires":["window IN ('1m', '3m', '6m', '1y')","is_real = TRUE"],"description":"组件直接向 Kafka Topic 生产消息的滚动窗口事实。"},{"name":"msc_kafka_producer_observation","verbalizes":["{component} 在 {environment:observed_environment} 环境截至 {Date:window_end} 的 {String:window} 窗口内通过 MSC 消息中心间接生产 {kafka_topic:topic} 共 {Integer:call_count} 次，直接生产标识为 {Boolean:is_real}"],"roles":[{"concept":"kafka_topic","name":"topic"},{"concept":"environment","name":"observed_environment"},{"concept":"Date","name":"window_end"},{"concept":"String","name":"window"},{"concept":"Integer","name":"call_count"},{"concept":"Boolean","name":"is_real"}],"requires":["window IN ('1m', '3m', '6m', '1y')","is_real = FALSE"],"description":"组件通过 MSC 消息中心服务间接向 Kafka Topic 生产消息的滚动窗口事实。"},{"name":"kafka_consumer_observation","verbalizes":["{component} 在 {environment:observed_environment} 环境截至 {Date:window_end} 的 {String:window} 窗口内消费 {kafka_topic:topic} 共 {Integer:call_count} 次"],"roles":[{"concept":"kafka_topic","name":"topic"},{"concept":"environment","name":"observed_environment"},{"concept":"Date","name":"window_end"},{"concept":"String","name":"window"},{"concept":"Integer","name":"call_count"}],"requires":["window IN ('1m', '3m', '6m', '1y')"],"description":"组件消费 Kafka Topic 的滚动窗口事实。"},{"name":"uses_redis_db","verbalizes":["{component} 使用 {redis_db}"],"roles":[{"concept":"redis_db"}],"multiplicity":"ManyToOne","description":"组件使用的 Redis 逻辑数据库；表示使用关系，不包含调用次数。"},{"name":"deployed_on_host","verbalizes":["{component} 部署在 {host}"],"roles":[{"concept":"host"}],"multiplicity":"ManyToOne","description":"组件部署所在的主机；用于查询组件部署在哪台主机以及主机上的组件。"},{"name":"deployed_in_cluster","verbalizes":["{component} 部署于 {deployment_cluster}"],"roles":[{"concept":"deployment_cluster"}],"multiplicity":"ManyToOne","description":"组件部署所在的部署集群；用于查询组件与集群的部署归属。"},{"name":"config_reference_observation","verbalizes":["{component} 的配置引用类型为 {String:reference_type}，引用 key 为 {String:referenced_config_key}，原值为 {String:raw_value}"],"roles":[{"concept":"String","name":"reference_type"},{"concept":"String","name":"referenced_config_key"},{"concept":"String","name":"raw_value"}],"requires":["reference_type IN ('global_config_reference', 'private_config_reference', 'literal_value')"]},{"name":"references_private_cfc_config","verbalizes":["{component} 引用 {private_cfc_config:private_config}"],"roles":[{"concept":"private_cfc_config","name":"private_config"}],"derived_by":["component.config_reference_observation(reference_type, referenced_config_key, raw_value) AND reference_type == 'private_config_reference' AND private_config.owner(component) AND private_config.config_key(referenced_config_key)"],"description":"组件引用或拥有的私有 CFC 配置；由私有配置归属关系派生。"},{"name":"references_global_cfc_config","verbalizes":["{component} 引用 {global_cfc_config:global_config}"],"roles":[{"concept":"global_cfc_config","name":"global_config"}],"derived_by":["component.config_reference_observation(reference_type, referenced_config_key, raw_value) AND reference_type == 'global_config_reference' AND global_config.config_key(referenced_config_key)"],"description":"组件引用的环境级全局 CFC 配置；由全局配置引用事实派生。"}]},{"concept":"microservice_component","type":"EntityType","description":"非 DB 且架构类型为 microservice 的组件。 别名：微服务。","extends":["component"],"derived_by":["component.component_type \u003c> 'DB' AND component.architecture_type == 'microservice'"]},{"concept":"core_service","type":"EntityType","description":"核心微服务；微服务组件中由业务重要性标签归一化后 is_core 为 Y 的对象。 别名：核心服务、核心微服务。","extends":["microservice_component"],"derived_by":["component.is_core == 'Y'"]},{"concept":"non_core_service","type":"EntityType","description":"非核心微服务；微服务组件中由业务重要性标签归一化后 is_core 为 N 的对象；base、external 和空标签不属于该概念。 别名：非核心服务、非核心微服务。","extends":["microservice_component"],"derived_by":["component.is_core == 'N'"]},{"concept":"graded_assurance_component","type":"EntityType","description":"非 DB 且具有非空保障等级的组件。 别名：分级保障组件、分保组件。","extends":["component"],"derived_by":["component.component_type \u003c> 'DB' AND EXISTS ( component.system_level )"]},{"concept":"graded_assurance_microservice_component","type":"EntityType","description":"非 DB、架构类型为 microservice 且具有非空保障等级的组件。 别名：分级保障微服务、分保微服务。","extends":["microservice_component","graded_assurance_component"],"derived_by":["component.component_type \u003c> 'DB' AND component.architecture_type == 'microservice' AND EXISTS ( component.system_level )"]},{"concept":"system","type":"EntityType","description":"业务系统。 别名：系统、子系统。","identify_by":["system_name"],"relationships":[{"name":"system_id","verbalizes":["{system} 平台标识是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"ManyToOne"},{"name":"system_name","verbalizes":["{system} 名称是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"OneToOne"},{"name":"display_name","description":"业务系统用于结果展示和中文名称筛选的显示名称。","verbalizes":["{system} 的显示名称是 {String:display_name}"],"roles":[{"concept":"String","name":"display_name"}],"multiplicity":"ManyToOne"},{"name":"system_level","verbalizes":["{system} 保障等级是 {String:system_level}"],"roles":[{"concept":"String","name":"system_level"}],"multiplicity":"ManyToOne","requires":["system_level IN ('1', '2', '3', '4')"]}]},{"concept":"department","type":"EntityType","description":"业务部门或组织单元。 别名：部门、组织单元。","identify_by":["department_name"],"relationships":[{"name":"department_name","verbalizes":["{department} 名称是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"OneToOne"}]},{"concept":"environment","type":"EntityType","description":"组件或资源所在的逻辑环境。 别名：环境、运行环境。","identify_by":["env_name"],"relationships":[{"name":"env_name","verbalizes":["{environment} 名称是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"OneToOne"}]},{"concept":"zone","type":"EntityType","description":"部署区域或可用区。 别名：区域、可用区。","identify_by":["zone_code"],"relationships":[{"name":"zone_code","verbalizes":["{zone} 编码是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"OneToOne"}]},{"concept":"api_interface","type":"EntityType","description":"由组件拥有的 API 接口。 别名：接口、API、endpoint。","identify_by":["owner","interface_name"],"relationships":[{"name":"owner","verbalizes":["{api_interface} 属于 {component}"],"roles":[{"concept":"component"}],"multiplicity":"ManyToOne","description":"API 接口所属的组件；用于查询接口属于哪个组件，以及组件拥有的接口。"},{"name":"interface_name","verbalizes":["{api_interface} 路径是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"ManyToOne"},{"name":"call_observation","verbalizes":["{api_interface} 在 {environment:observed_environment} 环境截至 {Date:window_end} 的 {String:window} 窗口内调用 {api_interface:called_interface} 共 {Integer:call_count} 次，平均耗时 {Decimal:avg_latency}，最近调用时间为 {DateTime:observed_at}"],"roles":[{"concept":"api_interface","name":"called_interface"},{"concept":"environment","name":"observed_environment"},{"concept":"Date","name":"window_end"},{"concept":"String","name":"window"},{"concept":"DateTime","name":"observed_at"},{"concept":"Integer","name":"call_count"},{"concept":"Decimal","name":"avg_latency"}],"requires":["window IN ('1m', '3m', '6m', '1y')"],"description":"接口间调用的滚动窗口事实；环境、窗口结束日和周期共同限定事实粒度。"}]},{"concept":"arch_rule","type":"EntityType","description":"架构治理规则。 别名：架构规则、治理规则、规范。","identify_by":["rule_key"],"relationships":[{"name":"rule_key","verbalizes":["{arch_rule} 标识是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"OneToOne"},{"name":"domain","verbalizes":["{arch_rule} 领域是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"ManyToOne"},{"name":"title","description":"架构规则标题，用于查询结果展示和文本筛选。","verbalizes":["{arch_rule} 的标题是 {String:title}"],"roles":[{"concept":"String","name":"title"}],"multiplicity":"ManyToOne"},{"name":"label","description":"架构规则的业务标签，可用于规则分类、筛选和展示。","verbalizes":["{arch_rule} 的标签是 {String:label}"],"roles":[{"concept":"String","name":"label"}],"multiplicity":"ManyToOne"},{"name":"description","description":"架构规则的业务含义和判定说明。","verbalizes":["{arch_rule} 的业务说明是 {String:description}"],"roles":[{"concept":"String","name":"description"}],"multiplicity":"ManyToOne"},{"name":"issue_site_template","description":"架构规则生成问题位置说明时使用的模板。","verbalizes":["{arch_rule} 的问题位置模板是 {String:issue_site_template}"],"roles":[{"concept":"String","name":"issue_site_template"}],"multiplicity":"ManyToOne"},{"name":"level","verbalizes":["{arch_rule} 严重程度是 {String:rule_level}"],"roles":[{"concept":"String","name":"rule_level"}],"multiplicity":"ManyToOne","requires":["rule_level IN ('致命', '严重', '一般', '提示')"]},{"name":"positive","description":"符合架构规则时的正向说明或正确示例。","verbalizes":["{arch_rule} 的正向说明是 {String:positive}"],"roles":[{"concept":"String","name":"positive"}],"multiplicity":"ManyToOne"},{"name":"negative","description":"违反架构规则时的反向说明或错误示例。","verbalizes":["{arch_rule} 的反向说明是 {String:negative}"],"roles":[{"concept":"String","name":"negative"}],"multiplicity":"ManyToOne"},{"name":"improvement","description":"违反架构规则后的治理和改进建议。","verbalizes":["{arch_rule} 的改进建议是 {String:improvement}"],"roles":[{"concept":"String","name":"improvement"}],"multiplicity":"ManyToOne"}]},{"concept":"arch_issue","type":"EntityType","description":"架构治理问题；逻辑身份由发生组件、环境、违反规则和问题标识共同确定，对应物理字段 cmp_name、env_name、rule_key、issue_key；风险和优化建议由 level 派生。 别名：架构问题、治理问题、问题明细。","identify_by":["detected_on_component","environment","violates_rule","issue_key"],"relationships":[{"name":"issue_key","verbalizes":["{arch_issue} 标识是 {String}"],"roles":[{"concept":"String"}],"multiplicity":"ManyToOne"},{"name":"detected_on_component","verbalizes":["{arch_issue} 发生于 {component}"],"roles":[{"concept":"component"}],"multiplicity":"ManyToOne","description":"架构问题发生或检测到的组件；用于从问题定位受影响组件。"},{"name":"environment","verbalizes":["{arch_issue} 发生于 {environment}"],"roles":[{"concept":"environment"}],"multiplicity":"ManyToOne","description":"架构问题发生的逻辑环境；同一问题在不同环境中分别观测。"},{"name":"violates_rule","verbalizes":["{arch_issue} 违反 {arch_rule}"],"roles":[{"concept":"arch_rule"}],"multiplicity":"ManyToOne","description":"架构问题违反的架构规则；用于从问题追溯判定规则。"},{"name":"detected_on_interface","verbalizes":["{arch_issue} 涉及 {api_interface}"],"roles":[{"concept":"api_interface"}],"multiplicity":"ManyToOne","description":"架构问题涉及的 API 接口；用于定位接口级架构问题。"},{"name":"level","verbalizes":["{arch_issue} 级别是 {String:issue_level}"],"roles":[{"concept":"String","name":"issue_level"}],"multiplicity":"ManyToOne","requires":["issue_level IN ('架构风险', '优化建议')"]},{"name":"issue_status","verbalizes":["{arch_issue} 状态是 {String:issue_status}"],"roles":[{"concept":"String","name":"issue_status"}],"multiplicity":"ManyToOne","requires":["issue_status IN ('resolved', 'unresolved')"]},{"name":"issue_type","verbalizes":["{arch_issue} 发现类型是 {String:issue_type}"],"roles":[{"concept":"String","name":"issue_type"}],"multiplicity":"ManyToOne","requires":["issue_type IN ('静态', '动态')"]},{"name":"issue_args","description":"架构问题判定时使用的业务参数或规则参数。","verbalizes":["{arch_issue} 的问题参数是 {String:issue_args}"],"roles":[{"concept":"String","name":"issue_args"}],"multiplicity":"ManyToOne"},{"name":"issue_site","desc function at(path){return path.split('.').reduce((o,k)=>o[k],editDraft)}function put(path,value){const p=path.split('.'),key=p.pop();let o=editDraft;for(const k of p)o=o[k];if(value||key in o)o[key]=value}function removeNode(path){const a=path.split('.'),index=Number(a.pop());at(a.join('.')).splice(index,1);renderMappingEditor()}function addNode(path,kind){const node=kind==='link'?{object_mapping:{expression:''},children:[]}:kind==='referent'?{relationship:'',expression:''}:{expression:''};at(path).push(node);renderMappingEditor()}function makeChild(path){const n=at(path);n.children=n.children||[];n.children.push({object_mapping:{expression:''},relationship:''});renderMappingEditor()}function makeReferent(path){const n=at(path);n.referent_mappings=n.referent_mappings||[];n.referent_mappings.push({relationship:'',expression:''});renderMappingEditor()}
function nodeEditor(n,path,label){let block=`<div class="editor-node"><details ${path.split('.').length<3?'open':''}><summary>${esc(label)} ${n.relationship?'<span class="badge">'+esc(n.relationship)+'</span>':''}${n.expression?'<span class="muted mono"> '+esc(n.expression)+'</span>':''}</summary>`;if('relationship' in n)block+=`<div class="row"><span class="muted" style="font-size:11px;width:55px">关系</span><input aria-label="映射关系" value="${esc(n.relationship)}" oninput="put('${path}.relationship',this.value)"></div>`;if('expression' in n)block+=`<div class="row"><span class="muted" style="font-size:11px;width:55px">表达式</span><input aria-label="映射表达式" value="${esc(n.expression)}" oninput="put('${path}.expression',this.value)"></div>`;if(!n.object_mapping&&!('relationship' in n))block+=`<div class="row"><span class="muted" style="font-size:11px;width:55px">概念</span><input aria-label="映射节点概念" value="${esc(n.concept)}" oninput="put('${path}.concept',this.value)"></div>`;if(n.object_mapping)block+=nodeEditor(n.object_mapping,path+'.object_mapping','对象节点');if(n.children)block+=n.children.map((c,i)=>nodeEditor(c,path+'.children.'+i,'关联 '+(i+1))).join('');if(n.referent_mappings)block+=n.referent_mappings.map((c,i)=>nodeEditor(c,path+'.referent_mappings.'+i,'标识引用 '+(i+1))).join('');block+=`<div class="row">${n.object_mapping?`<button class="btn link" onclick="makeChild('${path}')">＋子节点</button>`:`<button class="btn link" onclick="makeReferent('${path}')">＋标识引用</button>`}${/\d$/.test(path)?`<button class="btn danger" onclick="removeNode('${path}')">删除节点</button>`:''}</div></details></div>`;return block}
function renderMappingEditor(){$('#mappingEditor').innerHTML=`<div class="blockhead"><h3>对象根 ${hint('expression 与 referent_mappings 均保存在原生 object 节点中。可新增多个对象根。')}</h3><button class="btn link" onclick="addNode('object_mappings','object')">＋对象根</button></div>${editDraft.object_mappings.map((n,i)=>nodeEditor(n,'object_mappings.'+i,'对象根 '+(i+1))).join('')}<div class="blockhead" style="margin-top:20px"><h3>关联树</h3><button class="btn link" onclick="addNode('link_mappings','link')">＋关联根</button></div>${editDraft.link_mappings.map((n,i)=>nodeEditor(n,'link_mappings.'+i,'关联根 '+(i+1))).join('')}`}
function newMappingForDataset(){const d=collections.datasets[selected];switchTab('mappings');editItem(null);editDraft.object_mappings=[{expression:d.name+'.'+(d.fields[0]?.name||'')}];renderMappingEditor()}
function sqlPreview(){const m=collections.metrics[selected],refs=datasetRefs(m),ds=sm.datasets.find(d=>d.name===refs[0]);if(refs.length!==1){openDrawer('SQL 预览 · '+m.name,`<div class="warningbox">引用 ${refs.length} 个数据集，当前仅提供查询解释。</div><div class="block">${refs.map(n=>'<div class="softbox">'+esc(n)+'</div>').join('')}</div>`,closeDrawer,true);$('#drawerSave').style.display='none';return}openDrawer('SQL 预览 · '+(synonyms(m)[0]||m.name),`<div class="reference-strip">${concept(m.name)}<span class="badge">SQL 生成示意 · 未执行</span></div><div class="sql-tools" style="margin-top:16px"><div><label class="formlabel">目标方言</label><select id="sqlDialect" onchange="renderSQL()"><option>POSTGRES</option><option>MYSQL</option><option>ANSI_SQL</option></select></div><div><label class="formlabel">分组字段 · group_by</label><select id="sqlGroup" onchange="renderSQL()"><option value="">不分组</option>${ds.fields.map(f=>`<option ${f.name==='env_name'?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div><label class="formlabel">快照策略 ${hint('原型仅拼接展示示例。实现将调用后端 sqlglot 编译器；筛选值参数绑定，不在浏览器执行 SQL。')}</label><select id="sqlTime" onchange="renderSQL()"><option value="eq">snapshot_date = 指定日期</option><option value="asof">as_of · 最近快照</option></select></div><div><label class="formlabel">日期</label><input type="date" id="sqlDate" value="2026-10-08" onchange="renderSQL()"></div></div><pre id="sqlOutput" class="sql-output"></pre><div class="block softbox"><h3>绑定参数</h3><code id="sqlParams"></code></div>`,closeDrawer,true);$('#drawerSave').style.display='none';renderSQL()}
function renderSQL(){const m=collections.metrics[selected],ds=sm.datasets.find(d=>d.name===datasetRefs(m)[0]);const group=$('#sqlGroup').value,dialect=$('#sqlDialect').value;const quote=x=>dialect==='MYSQL'?'`'+x+'`':'"'+x+'"';let expr=expression(m);[...ds.fields].sort((a,b)=>b.name.length-a.name.length).forEach(f=>{expr=expr.split(ds.name+'.'+f.name).join('('+expression(f)+')')});const gf=ds.fields.find(f=>f.name===group),tf=ds.fields.find(f=>f.name==='snapshot_date');let sql='SELECT\n  '+(gf?expression(gf)+' AS '+quote(group)+',\n  ':'')+expr+' AS '+quote(m.name)+'\nFROM '+ds.source.split('.').map(quote).join('.');if(tf)sql+='\nWHERE '+expression(tf)+($('#sqlTime').value==='asof'?' = (SELECT MAX('+expression(tf)+')\n  FROM '+ds.source+' WHERE '+expression(tf)+' <= :as_of)':' = :snapshot_date');if(gf)sql+='\nGROUP BY '+expression(gf);sql+='\nLIMIT 100';$('#sqlOutput').textContent=sql;$('#sqlParams').textContent=JSON.stringify(tf?{[$('#sqlTime').value==='asof'?'as_of':'snapshot_date']:$('#sqlDate').value}:{},null,2)}
$('#contextHint').innerHTML=hint(sm.ai_context.instructions);renderCatalog();renderDetail();
</script></body></html>
