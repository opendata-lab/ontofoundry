const exampleComponents=[['order-api','订单接口服务','order','交易平台','trade-platform','交易平台部'],['order-worker','订单异步处理','order','交易平台','trade-platform','交易平台部'],['payment-core','支付核心','payment','支付中心','payment-center','支付技术部'],['payment-gateway','支付网关','payment','支付中心','payment-center','支付技术部'],['account-api','账户服务','account','账户中心','account-center','账户技术部'],['risk-engine','风控引擎','risk','风险管理','risk-management','风险技术部'],['inventory-api','库存服务','inventory','供应链平台','supply-chain','供应链技术部'],['delivery-worker','配送处理','delivery','供应链平台','supply-chain','供应链技术部'],['notification-hub','通知中心','notification','公共服务','public-service','基础平台部'],['search-indexer','搜索索引','search','公共服务','public-service','基础平台部'],['customer-api','客户服务','customer','客户中心','customer-center','客户技术部'],['report-scheduler','报表调度','report','数据平台','data-platform','数据平台部']];
const systemExamples=[['trade-platform','交易平台'],['payment-center','支付中心'],['account-center','账户中心'],['risk-management','风险管理'],['supply-chain','供应链平台'],['public-service','公共服务'],['customer-center','客户中心'],['data-platform','数据平台']];
function instanceRows(key=current) {const o=object(key);if(!o)return [];if(key==='component'||key==='microservice_component'){return exampleComponents.map((c,i)=>({component_name:c[0],component_name_cn:c[1],component_type:'APP',architecture_type:'microservice',business_importance_label:i<5?'core':'normal',is_core:i<5?'Y':'N',system_level:i<5?'L1':'L2',system_name:c[4],dept_name:c[5],env_name:'PROD',zone:'cn-east',host_name:`prod-app-${String(i+1).padStart(2,'0')}`,cluster_name:'prod-k8s-east',snapshot_date:'2026-10-13'}));}if(key==='system')return systemExamples.map((s,i)=>({system_name:s[0],system_id:`SYS-${String(i+1).padStart(3,'0')}`,display_name:s[1],system_level:i<4?'L1':'L2'}));if(key==='department')return [...new Set(exampleComponents.map(c=>c[5]))].map((name,i)=>({department_name:['trade-platform-dept','payment-tech','account-tech','risk-tech','supply-chain-tech','platform-tech','customer-tech','data-platform-dept'][i],display_name:name}));return Array.from({length:4},(_,i)=>Object.fromEntries(o.properties.map(p=>[p.technical,p.type==='整数'?i+1:p.type==='日期'?'2026-10-13':`${p.technical}-${i+1}`])));}
function instanceColumns() {const o=object();const base=o.properties.map(p=>p.technical);const ordered=[...o.key,...base.filter(p=>!o.key.includes(p))];return ordered.slice(0,5);}
function columnLabel(tech) {return object().properties.find(p=>p.technical===tech)?.name || tech;}
function renderInstances() {$('body').innerHTML=`<div class="toolbar"><label class="search">${icon('search')}<input id="instance-search" aria-label="搜索实例" placeholder="搜索实例" value="${esc(instanceQuery)}"></label><span class="muted">实例值为演示样例，属性与来源字段依据架构治理工作空间快照。</span></div><div class="instance-layout"><div class="instance-main"><div class="table-wrap"><table class="instances"><thead><tr>${instanceColumns().map((c,i)=>`<th>${esc(columnLabel(c))}${i===0?'<span class="tag key" style="margin-left:5px">标识</span>':''}</th>`).join('')}</tr></thead><tbody id="instance-rows"></tbody></table></div><div id="instance-pager" class="pager"></div></div><aside id="instance-side" class="instance-side" hidden></aside></div>`;renderInstanceRows();if(selectedInstance!==null)renderInstanceDetail(selectedInstance);}
function visibleInstances() {return instanceRows().map((row,index)=>({row,index})).filter(({row})=>Object.values(row).some(v=>String(v).toLowerCase().includes(instanceQuery.toLowerCase())));}
function renderInstanceRows() {const rows=visibleInstances(),pageSize=6,pages=Math.max(1,Math.ceil(rows.length/pageSize));instancePage=Math.min(instancePage,pages);const cols=instanceColumns();$('instance-rows').innerHTML=rows.slice((instancePage-1)*pageSize,instancePage*pageSize).map(({row,index})=>`<tr class="open-row" data-instance="${index}" tabindex="0" aria-label="查看实例${esc(row[cols[0]])}">${cols.map(c=>`<td>${esc(row[c]??'—')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length||1}" class="empty">无匹配实例</td></tr>`;$('instance-pager').innerHTML=`<span>共 ${rows.length} 条</span><button class="btn" data-action="instance-prev" ${instancePage===1?'disabled':''}>上一页</button><span>${instancePage} / ${pages}</span><button class="btn" data-action="instance-next" ${instancePage===pages?'disabled':''}>下一页</button>`;}
function instanceRelations(row) {if(current==='component'||current==='microservice_component')return [{name:'belongs_to_system',key:'system',index:systemExamples.findIndex(s=>s[0]===row.system_name),text:row.system_name},{name:'belongs_to_department',key:'department',index:instanceRows('department').findIndex(r=>r.display_name===row.dept_name),text:row.dept_name},{name:'declares_dependency_on',key:'component',index:(selectedInstance+1)%exampleComponents.length,text:exampleComponents[(selectedInstance+1)%exampleComponents.length][0]}];if(current==='system')return exampleComponents.map((c,i)=>({c,i})).filter(({c})=>c[4]===row.system_name).map(({c,i})=>({name:'← belongs_to_system',key:'component',index:i,text:c[0]}));if(current==='department')return exampleComponents.map((c,i)=>({c,i})).filter(({c})=>c[5]===row.display_name).map(({c,i})=>({name:'← belongs_to_department',key:'component',index:i,text:c[0]}));return [];}
function renderInstanceDetail(index) {selectedInstance=index;const row=instanceRows()[index];if(!row)return;const o=object(),side=$('instance-side');side.hidden=false;side.innerHTML=`<header><h3 class="grow">${esc(row[o.key[0]]||'实例详情')}</h3><button class="icon-btn" data-action="close-instance" aria-label="关闭详情">${icon('close')}</button></header><div class="side-content"><section><h3>属性</h3><dl class="info-grid">${o.properties.map(p=>`<dt>${esc(p.name)}</dt><dd>${esc(row[p.technical]??'—')}</dd>`).join('')}</dl></section><section><h3>关联实例</h3>${instanceRelations(row).map(r=>`<div class="related-instance"><small>${esc(r.name)}</small><button class="link" data-related-object="${r.key}" data-related-index="${Math.max(0,r.index)}">${esc(object(r.key)?.name)} · ${esc(r.text)}</button></div>`).join('')||'<span class="muted">无关联实例</span>'}</section></div>`;}
function openSource(table = '', primary = false) {closePopovers();sourceOperation={table,primary,existing:!!table};$('source-title').textContent=primary?'设置主表':table?'关联字段':'添加数据来源';$('confirm-source').textContent=table?'保存':'添加';const available=Object.keys(INITIAL.tables).filter(t=>!object().sources.some(s=>s.table===t));if(!table)table=available.find(t=>t.includes('cmp'))||available[0]||'';sourceOperation.table=table;$('source-content').innerHTML=`${sourceOperation.existing?`<label class="field"><span class="label">${primary?'主表':'来源表'}</span>${tableText(table)}</label>`:`<label class="field"><span class="label">来源表</span><select id="add-source-select">${available.map(t=>option(t,shortTable(t),table,`title="${esc(t)}"`)).join('')}</select></label>`}<div id="source-joins"></div><div id="source-error" class="error" role="alert"></div>`;renderSourceJoins();$('source-dialog').showModal();}
function renderSourceJoins() {const table=sourceOperation.table,main=sourceOperation.primary?table:object().sources[0]?.table;$('source-joins').innerHTML='';if(!main||(!sourceOperation.primary&&main===table))return;const others=sourceOperation.primary?object().sources.filter(s=>s.table!==table):[{table}];$('source-joins').innerHTML=`<section class="extra-section"><h3>关联字段</h3>${others.map((s,i)=>{const secondary=sourceOperation.primary?s.table:table,common=columns(main).find(c=>columns(secondary).some(x=>x.name===c.name))?.name||'';const existing=!sourceOperation.primary?object().sources.find(s=>s.table===table)?.join:[];const matches=existing?.length?existing:[{main:columns(main).some(c=>c.name==='cmp_name')&&columns(secondary).some(c=>c.name==='cmp_name')?'cmp_name':common,secondary:columns(main).some(c=>c.name==='cmp_name')&&columns(secondary).some(c=>c.name==='cmp_name')?'cmp_name':common}];return `<div class="join-group" data-secondary="${esc(secondary)}"><div class="join-grid"><small title="${esc(main)}">主表 · ${esc(shortTable(main))}</small><span></span><small title="${esc(secondary)}">附表 · ${esc(shortTable(secondary))}</small></div>${matches.map(j=>joinRow(main,secondary,j)).join('')}<button class="btn text" data-add-join="${i}" data-main="${esc(main)}" data-secondary="${esc(secondary)}">＋ 添加关联字段</button></div>`;}).join('')}</section>`;}
function joinRow(main,secondary,j={main:'',secondary:''}) {return `<div class="join-grid join-row"><select class="join-main" aria-label="主表关联字段">${columnOptions(main,j.main,true)}</select><span class="muted">=</span><select class="join-secondary" aria-label="附表关联字段">${columnOptions(secondary,j.secondary,true)}</select></div>`;}
function confirmSource() {const o=object(),groups=[...$('source-joins').querySelectorAll('.join-group')];const joins=groups.map(g=>({table:g.dataset.secondary,join:[...g.querySelectorAll('.join-row')].map(row=>({main:row.querySelector('.join-main').value,secondary:row.querySelector('.join-secondary').value}))}));if(!sourceOperation.table){$('source-error').textContent='请选择来源表';return;}if(joins.some(g=>g.join.some(j=>!j.main||!j.secondary))){$('source-error').textContent='请选择主表与附表的关联字段';return;}if(sourceOperation.primary){const primary=o.sources.find(s=>s.table===sourceOperation.table);o.sources=[{...primary,join:[]},...o.sources.filter(s=>s.table!==primary.table).map(s=>({...s,join:joins.find(j=>j.table===s.table)?.join||[]}))];}else if(sourceOperation.existing){o.sources.find(s=>s.table===sourceOperation.table).join=joins[0]?.join||[];}else o.sources.push({table:sourceOperation.table,join:joins[0]?.join||[]});selectedSource=sourceOperation.table;$('source-dialog').close();render();}
function openKey() {$('key-error').textContent='';$('key-options').innerHTML=object().properties.map(p=>`<label class="key-option"><input type="checkbox" value="${esc(p.technical)}" ${object().key.includes(p.technical)?'checked':''}><span>${esc(p.name)}<span class="sub">${esc(p.technical)}</span></span></label>`).join('');$('key-dialog').showModal();}
function showInfo(kind,button) {const content={evidence:`<h3>来源证据</h3>${evidenceItems(object()).map(item=>`<p style="white-space:pre-wrap">${esc(typeof item==='string'?item:JSON.stringify(item,null,2))}</p>`).join('')}`,graph:'<h3>关系</h3><p>箭头指向目标对象。选择对象可打开详情；边上数字为关系数量，悬停查看关系名称。双向箭头表示同时存在入向与出向关系。</p>'};closePopovers();$('info-pop').innerHTML=content[kind]||'';placePopover($('info-pop'),button);}
function addProperty() {if(!editing)beginEdit();propertyQuery='';sourceFilter='';let i=1;while(object().properties.some(p=>p.technical===`property_${i}`))i++;object().properties.push({name:`属性 ${i}`,technical:`property_${i}`,type:'未知',identifier:false,bindings:[]});renderTabs();renderProperties();const fields=[...$('body').querySelectorAll('[data-property-name]')];fields.at(-1)?.focus();fields.at(-1)?.select();}
function generateProperties() {const table=selectedSource||object().sources[0]?.table;if(!table)return;for(const col of columns(table)){let p=object().properties.find(p=>p.technical===col.logical||p.bindings.some(b=>b.table===table&&b.column===col.name));if(!p){p={name:col.logical,technical:col.logical,type:col.type,identifier:false,bindings:[]};object().properties.push(p);}if(!p.bindings.some(b=>b.table===table&&b.column===col.name))p.bindings.push({table,column:col.name,type:col.type,derived:col.derived});if(p.type==='未知')p.type=col.type;}propertyQuery='';sourceFilter='';renderTabs();renderProperties();}
function saveObject() {const o=object();if(!o.name.trim()||!o.technical.trim()){$('object-error').textContent='请填写名称与英文名';return;}if(!o.properties.every(p=>p.name.trim())){$('object-error').textContent='请填写属性名称';return;}const names=o.properties.map(p=>p.name.trim());if(new Set(names).size!==names.length){$('object-error').textContent='属性名称不可重复';return;}o.name=o.name.trim();saved=draft;draft=null;editing=false;render();renderPage();showToast('已保存');}
function handleAction(action) {if(action==='set-key')openKey();if(action==='add-source')openSource();if(action==='add-property')addProperty();if(action==='generate-properties')generateProperties();if(action==='add-relation')openRelation();if(action==='zoom-in'){graphZoom=Math.min(1.5,graphZoom+.1);renderGraph();}if(action==='zoom-out'){graphZoom=Math.max(.6,graphZoom-.1);renderGraph();}if(action==='zoom-reset'){graphZoom=1;renderGraph();}if(action==='instance-next'){instancePage++;renderInstanceRows();}if(action==='instance-prev'){instancePage--;renderInstanceRows();}if(action==='close-instance'){selectedInstance=null;$('instance-side').hidden=true;}}
$('tabs').onclick=event=>{const tab=event.target.closest('[data-tab]');if(tab)switchTab(tab.dataset.tab);};
$('tabs').onkeydown=event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;const tabs=[...$('tabs').querySelectorAll('[role=tab]')],index=tabs.indexOf(event.target);if(index<0)return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;switchTab(tabs[next].dataset.tab);$('tabs').querySelector('[aria-selected=true]').focus();};
$('body').onclick=event=>{const el=event.target.closest('[data-action],[data-tab],[data-object],[data-relation],[data-instance],[data-related-object],[data-info],[data-source],[data-source-menu],[data-delete-property]');if(!el)return;if(el.dataset.action)handleAction(el.dataset.action);else if(el.dataset.tab)switchTab(el.dataset.tab);else if(el.dataset.object)openObject(el.dataset.object);else if(el.dataset.relation)openRelation(el.dataset.relation);else if(el.dataset.instance!==undefined)renderInstanceDetail(Number(el.dataset.instance));else if(el.dataset.relatedObject){const key=el.dataset.relatedObject,index=Number(el.dataset.relatedIndex);openObject(key);switchTab('instances');renderInstanceDetail(index);}else if(el.dataset.info)showInfo(el.dataset.info,el);else if(el.dataset.source){selectedSource=el.dataset.source;renderProperties();}else if(el.dataset.sourceMenu){sourceMenuTable=el.dataset.sourceMenu;closePopovers();$('make-primary').disabled=object().sources[0].table===sourceMenuTable;$('edit-source-join').hidden=object().sources[0].table===sourceMenuTable;$('remove-source').disabled=object().sources.length>1&&object().sources[0].table===sourceMenuTable;placePopover($('source-menu'),el);}else if(el.dataset.deleteProperty){const tech=el.dataset.deleteProperty;object().properties=object().properties.filter(p=>p.technical!==tech);object().key=object().key.filter(k=>k!==tech);renderTabs();renderProperties();}};
$('body').onkeydown=event=>{if(['Enter',' '].includes(event.key)&&event.target.matches('[data-object],[data-relation],[data-instance]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}};
$('body').oninput=event=>{const el=event.target;if(el.id==='property-search'){propertyQuery=el.value;renderPropertyRows();}else if(el.id==='relation-search')renderRelationRows(el.value);else if(el.id==='instance-search'){instanceQuery=el.value;instancePage=1;selectedInstance=null;$('instance-side').hidden=true;renderInstanceRows();}else if(el.dataset.propertyName){const p=object().properties.find(p=>p.technical===el.dataset.propertyName);p.name=el.value;}else if(el.dataset.overview){object()[el.dataset.overview]=el.value;}};
$('body').onchange=event=>{const el=event.target;if(el.id==='source-filter'){sourceFilter=el.value;renderPropertyRows();}else if(el.dataset.bind){const p=object().properties.find(p=>p.technical===el.dataset.bind),index=Number(el.dataset.index);if(!el.value)p.bindings.splice(index,1);else{const [table,column]=el.value.split('|'),col=columns(table).find(c=>c.name===column);p.bindings[index]={table,column,type:col.type,derived:col.derived};if(p.type==='未知')p.type=col.type;}renderHeader();renderPropertyRows();}else if(el.dataset.propertyType){object().properties.find(p=>p.technical===el.dataset.propertyType).type=el.value;}};
$('relationship-cards').oninput=event=>{const el=event.target;if(el.dataset.rel==='name'){relationDraft.name=el.value;$('relation-title').textContent=relationName(relationDraft);}else if(el.dataset.attrColumn!==undefined)relationDraft.attributes[Number(el.dataset.attrColumn)].column=el.value;};
$('relationship-cards').onchange=event=>{const el=event.target,r=relationDraft;if(el.dataset.rel){const k=el.dataset.rel;r[k]=k==='mapping'?el.checked:el.value;if(k==='source'||k==='target'){r[k+'Property']=object(r[k])?.key[0]||'';renderRelationship();}else if(k==='mapping')renderRelationship();else if(k==='table'){r.sourceColumn='';r.targetColumn='';for(const role of r.roles)role.column='';for(const a of r.attributes)if(a.name!=='window')a.column='';renderRelationship();}else if(k==='sourceProperty'||k==='targetProperty')renderRelationship();}else if(el.dataset.roleObject!==undefined){const role=r.roles[Number(el.dataset.roleObject)];role.object=el.value;role.property=object(role.object)?.key[0] || '';renderRelationship();}else if(el.dataset.roleProperty!==undefined)r.roles[Number(el.dataset.roleProperty)].property=el.value;else if(el.dataset.roleColumn!==undefined)r.roles[Number(el.dataset.roleColumn)].column=el.value;else if(el.dataset.attrColumn!==undefined)r.attributes[Number(el.dataset.attrColumn)].column=el.value;else if(el.dataset.attrType!==undefined)r.attributes[Number(el.dataset.attrType)].type=el.value;};
$('switch-direction').onclick=()=>{const r=relationDraft;if(!r.target)return;[r.source,r.target]=[r.target||r.source,r.source];[r.sourceProperty,r.targetProperty]=[r.targetProperty||r.sourceProperty,r.sourceProperty];[r.sourceColumn,r.targetColumn]=[r.targetColumn||r.sourceColumn,r.sourceColumn];renderRelationship();};
$('edit-relation').onclick=()=>{relationEditing=true;renderRelationship();};
$('save-relation').onclick=saveRelation;$('delete-relation').onclick=()=>{working().relations=working().relations.filter(r=>r.id!==relationOriginal);$('relation-dialog').close();render();if(!editing)showToast('已删除');};
$('source-content').onchange=event=>{if(event.target.id==='add-source-select'){sourceOperation.table=event.target.value;renderSourceJoins();}};
$('source-content').onclick=event=>{const el=event.target.closest('[data-add-join]');if(el)el.insertAdjacentHTML('beforebegin',joinRow(el.dataset.main,el.dataset.secondary));};
$('confirm-source').onclick=confirmSource;$('make-primary').onclick=()=>openSource(sourceMenuTable,true);$('edit-source-join').onclick=()=>openSource(sourceMenuTable);$('remove-source').onclick=()=>{const table=sourceMenuTable;object().sources=object().sources.filter(s=>s.table!==table);object().properties.forEach(p=>p.bindings=p.bindings.filter(b=>b.table!==table));closePopovers();render();};
$('confirm-key').onclick=()=>{const keys=[...$('key-options').querySelectorAll('input:checked')].map(el=>el.value);if(!keys.length){$('key-error').textContent='请选择至少一个属性';return;}object().key=keys;$('key-dialog').close();render();};
for(const button of document.querySelectorAll('[data-close]'))button.onclick=() => $(button.dataset.close).close();
$('edit-object').onclick=beginEdit;$('cancel-object').onclick=()=>{editing=false;draft=null;render();};$('save-object').onclick=saveObject;
$('expand-object').onclick=()=>{const expanded=$('object-dialog').classList.toggle('expanded');$('expand-object').setAttribute('aria-label',expanded?'收起':'展开');$('expand-object').title=expanded?'收起':'展开';renderHeader();};
$('close-object').onclick=()=>{$('object-dialog').close();};$('object-dialog').addEventListener('cancel',()=>{editing=false;draft=null;});$('object-dialog').addEventListener('close',()=>{editing=false;draft=null;closePopovers();setExampleSurface();});
$('copy-link').onclick=async()=>{const url=new URL(location.href);url.hash=`object=${encodeURIComponent(current)}`;try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(url.href);else throw new Error('fallback');showToast('链接已复制');}catch{const input=document.createElement('textarea');input.value=url.href;input.style.position='fixed';input.style.opacity='0';$('object-dialog').append(input);input.select();const ok=document.execCommand('copy');input.remove();if(ok)showToast('链接已复制');else{closePopovers();$('info-pop').innerHTML='<h3>对象链接</h3><input id="copy-fallback" aria-label="对象链接" readonly>';$('copy-fallback').value=url.href;placePopover($('info-pop'),$('copy-link'));$('copy-fallback').select();}}};
$('example-object').onchange=event=>openObject(event.target.value);$('open-example').onclick=()=>openObject($('example-object').value||current);$('page-search').oninput=renderPage;
$('page-rows').onclick=event=>{const row=event.target.closest('[data-object]');if(row)openObject(row.dataset.object);};$('page-rows').onkeydown=event=>{if(event.key==='Enter'&&event.target.dataset.object)openObject(event.target.dataset.object);};
window.addEventListener('resize',closePopovers);
renderPage();const requested=new URLSearchParams(location.hash.slice(1)).get('object');openObject(saved.objects[requested]?requested:'component');
