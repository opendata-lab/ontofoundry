 direct.forEach(r=>{edgeSet.add(r.id);r.objectEnds.forEach(id=>nodeSet.add(id));if(selection.kind!=='object')r.valueEnds.forEach(id=>valueSet.add(id));});
 // Inheritance is embedded separately and does not inflate the 31 link-type count.
 if(selection.kind==='object')objects.forEach(o=>o.extends.forEach(id=>{if(o.id===selection.id)nodeSet.add(id);if(id===selection.id)nodeSet.add(o.id);}));
 return {nodeSet,edgeSet,valueSet};
}
function pathBetween(a,b,bend=0){
 if(a.id===b.id){return {d:`M ${a.x-35} ${a.y-26} C ${a.x-110-bend} ${a.y-115-bend}, ${a.x+110+bend} ${a.y-115-bend}, ${a.x+35} ${a.y-26}`,lx:a.x,ly:a.y-88-bend};}
 const dx=b.x-a.x,dy=b.y-a.y;
 const trim=()=>Math.min((nodeWidth/2+3)/Math.max(Math.abs(dx),.001),(nodeHeight/2+4)/Math.max(Math.abs(dy),.001));
 const t=trim();const sx=a.x+dx*t,sy=a.y+dy*t,ex=b.x-dx*t,ey=b.y-dy*t;
 const len=Math.hypot(dx,dy)||1,cx=(sx+ex)/2-dy/len*bend,cy=(sy+ey)/2+dx/len*bend;
 return {d:`M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}`,lx:(sx+2*cx+ex)/4,ly:(sy+2*cy+ey)/4};
}
function renderGraph(){
 const focus=connected(),selection=allMap.get(state.selection);
 state.visibleObjects=objects;
 state.visibleRelations=relations;
 state.visibleValues=values.filter(v=>focus.valueSet.has(v.id));
 const visibleNodes=[...state.visibleObjects,...state.visibleValues];
 const visibleSet=new Set(visibleNodes.map(o=>o.id));
 const activeEdges=focus.edgeSet;
 const edgePairCounts=new Map();
 $('edge-layer').innerHTML=state.visibleRelations.map(r=>{
  const a=objectMap.get(r.source),b=allMap.get(r.target);
  if(!a||!b)return '';
  // Literal-only relations use a loop until the relation or its value is selected.
  const end=visibleSet.has(b.id)?b:a;
  const pair=[a.id,end.id].sort().join('|'),slot=edgePairCounts.get(pair)||0;edgePairCounts.set(pair,slot+1);
  const bend=a.id===end.id?slot*35:(slot%2===0?1:-1)*(slot?20+slot*20:0);
  const p=pathBetween(a,end,bend),active=activeEdges.has(r.id),labelWidth=r.name.length*10+14;
  const detailBranches=selection&&(selection.kind==='relation'||selection.kind==='value')&&active;
  const branches=detailBranches?relationEnds(r).filter(id=>id!==a.id&&id!==end.id&&visibleSet.has(id)).map(id=>{const n=allMap.get(id),branch=pathBetween(a,n,24);return `<path class="line branch" d="${branch.d}"/>`;}).join(''):'';
  return `<g class="edge ${active?'active':selection?'dimmed':''}" tabindex="0" role="button" aria-label="${esc(r.name+'，'+endpointText(r))}" data-edge="${esc(r.id)}"><title>${esc(r.technical_name+' · '+endpointText(r))}</title><path class="hit" d="${p.d}"/><path class="line" d="${p.d}"/>${branches}<rect class="label-bg" x="${p.lx-labelWidth/2}" y="${p.ly-9}" width="${labelWidth}" height="18" rx="3"/><text class="edge-label" x="${p.lx}" y="${p.ly+3}" text-anchor="middle">${esc(r.name)}</text></g>`;
 }).join('');
 $('inheritance-layer').innerHTML=state.visibleObjects.flatMap(o=>o.extends.filter(id=>visibleSet.has(id)).map(id=>{const p=pathBetween(o,objectMap.get(id),-20);return `<g class="inheritance ${selection&&!focus.nodeSet.has(o.id)?'dimmed':''}"><path d="${p.d}"/><text x="${p.lx}" y="${p.ly-5}" text-anchor="middle">继承</text></g>`;})).join('');
 $('node-layer').innerHTML=visibleNodes.map(o=>{
  const selected=o.id===state.selection,related=focus.nodeSet.has(o.id)||focus.valueSet.has(o.id);
  const count=o.kind==='object'?DATA.properties.filter(p=>p.owner===o.id).length:0;
  const tech=o.technical_name.length>25?o.technical_name.slice(0,24)+'…':o.technical_name;
  return `<g class="node ${o.kind==='value'?'value':''} ${selected?'selected':related?'related':selection?'dimmed':''}" transform="translate(${o.x-nodeWidth/2} ${o.y-nodeHeight/2})" tabindex="0" role="button" aria-label="${esc(o.name)}" data-node="${esc(o.id)}"><title>${esc(o.name+' · '+o.technical_name)}</title><rect class="card" width="${nodeWidth}" height="${nodeHeight}" rx="6"/><rect class="mark" x="11" y="14" width="24" height="24" rx="5"/><svg x="15" y="18" width="16" height="16" class="box-icon"><use href="#i-${o.kind==='value'?'value':'box'}"/></svg><text class="node-title" x="44" y="23">${esc(o.name)}</text><text class="technical" x="44" y="39">${esc(tech)}</text>${o.kind==='object'?`<rect class="count-bg" x="160" y="17" width="17" height="16" rx="5"/><text class="node-count" x="168.5" y="28" text-anchor="middle">${count}</text>`:''}</g>`;
 }).join('');
 $('status').textContent=`显示 ${state.visibleObjects.length} / ${objects.length} 个对象 · ${state.visibleRelations.length} / ${relations.length} 个关系`;
 $('canvas-empty').hidden=Boolean(visibleNodes.length);
 $('selection-chip').hidden=!selection;
 if(selection){$('selection-name').textContent=selection.name;$('selection-chip').querySelector('use').setAttribute('href','#i-'+(selection.kind==='relation'?'link':selection.kind==='value'?'value':'box'));}
 renderMinimap();applyTransform();
}
function worldBounds(){const ns=[...state.visibleObjects,...state.visibleValues];return ns.length?{left:Math.min(...ns.map(n=>n.x))-nodeWidth/2-55,top:Math.min(...ns.map(n=>n.y))-nodeHeight/2-85,right:Math.max(...ns.map(n=>n.x))+nodeWidth/2+55,bottom:Math.max(...ns.map(n=>n.y))+nodeHeight/2+60}:{left:0,top:0,right:1800,bottom:1200};}
function renderMinimap(){
 const b=worldBounds();const full={left:Math.min(0,b.left),top:Math.min(0,b.top),right:Math.max(1800,b.right),bottom:Math.max(1200,b.bottom)};
 $('minimap').querySelector('svg').setAttribute('viewBox',`${full.left} ${full.top} ${full.right-full.left} ${full.bottom-full.top}`);
 $('mini-content').innerHTML=state.visibleRelations.map(r=>{const a=objectMap.get(r.source),b=objectMap.get(r.target);return a&&b?`<path class="mini-edge" d="M${a.x} ${a.y} L${b.x} ${b.y}"/>`:'';}).join('')+[...state.visibleObjects,...state.visibleValues].map(o=>`<rect class="mini-node ${o.id===state.selection?'selected':''}" x="${o.x-92}" y="${o.y-26}" width="184" height="53" rx="6"/>`).join('');
}
function applyTransform(){
 $('viewport').setAttribute('transform',`translate(${state.x} ${state.y}) scale(${state.scale})`);
 $('zoom-label').textContent=Math.round(state.scale*100)+'%';
 const rect=$('canvas').getBoundingClientRect();
 const mini=$('mini-viewport');mini.setAttribute('x',-state.x/state.scale);mini.setAttribute('y',-state.y/state.scale);mini.setAttribute('width',rect.width/state.scale);mini.setAttribute('height',rect.height/state.scale);
}
function fit(){
 const b=worldBounds(),rect=$('canvas').getBoundingClientRect(),availW=Math.max(100,rect.width-48),availH=Math.max(100,rect.height-110);
 state.scale=Math.max(.12,Math.min(1.3,availW/(b.right-b.left),availH/(b.bottom-b.top)));
 state.x=rect.width/2-(b.left+b.right)/2*state.scale;state.y=(rect.height-20)/2-(b.top+b.bottom)/2*state.scale;
 applyTransform();
}
function centreSelection(){
 const item=allMap.get(state.selection);if(!item)return;
 const rect=$('canvas').getBoundingClientRect();
 const points=item.kind==='relation'?relationEnds(item).map(id=>allMap.get(id)).filter(Boolean):[item];
 const cx=points.reduce((sum,p)=>sum+p.x,0)/points.length,cy=points.reduce((sum,p)=>sum+p.y,0)/points.length;
 if(item.kind==='relation'){
  const w=Math.max(...points.map(p=>p.x))-Math.min(...points.map(p=>p.x))+nodeWidth+180;
  const h=Math.max(...points.map(p=>p.y))-Math.min(...points.map(p=>p.y))+nodeHeight+180;
  state.scale=Math.max(.12,Math.min(1.1,(rect.width-60)/w,(rect.height-110)/h));
 }else state.scale=Math.max(state.scale,Math.min(.9,(rect.width-50)/480));
 state.x=rect.width/2-cx*state.scale;state.y=(rect.height-30)/2-cy*state.scale;applyTransform();
}
function select(id,fromGraph=false){
 closeMenu();state.selection=id;const item=allMap.get(id);if(!item)return;
 if(fromGraph){const group=groups.find(g=>g.items.some(i=>i.id===id));if(group)state.closed.delete(group.id);state.query='';$('filter').value='';}
 renderTree();renderGraph();centreSelection();
 if(fromGraph){const row=[...$('tree').querySelectorAll('[data-row]')].find(r=>r.dataset.row===id);row?.scrollIntoView({block:'nearest'});}
}
function clearSelection(){state.selection=null;closeMenu();renderTree();renderGraph();fit();}
function setCollapsed(value,remember=true){
 state.collapsed=value;$('explorer').classList.toggle('collapsed',value);
 $('collapse').setAttribute('aria-expanded',String(!value));$('collapse').setAttribute('aria-label',value?'展开资源管理器':'收起资源管理器');$('collapse').title=value?'展开资源管理器':'收起资源管理器';$('collapse').querySelector('use').setAttribute('href',value?'#i-open-panel':'#i-panel');
 if(remember){try{localStorage.setItem('ontofoundry.semantic.explorer.collapsed',String(value));}catch(_){}}
 requestAnimationFrame(()=>{if(state.selection)centreSelection();else fit();});
}
let menuItem=null,menuAnchor=null;
function closeMenu(restore=false){$('context-menu').hidden=true;if(menuAnchor){menuAnchor.setAttribute('aria-expanded','false');if(restore&&menuAnchor.isConnected)menuAnchor.focus();}menuAnchor=null;}
function openMenu(id,anchor){
 if(menuItem===id&&!$('context-menu').hidden){closeMenu(true);return;}
 closeMenu();menuItem=allMap.get(id);menuAnchor=anchor;anchor.setAttribute('aria-expanded','true');
 $('menu-add').hidden=menuItem.kind!=='object';$('context-menu').hidden=false;
 const r=anchor.getBoundingClientRect(),m=$('context-menu').getBoundingClientRect();
 $('context-menu').style.left=Math.min(innerWidth-m.width-8,r.right+4)+'px';$('context-menu').style.top=Math.min(innerHeight-m.height-8,r.top)+'px';
 $('context-menu').querySelector('button').focus();
}
function popupHead(name,technical='',mark='box'){return `<header class="dialog-head"><span class="dialog-mark">${icon(mark)}</span><div class="dialog-title"><h2 id="popup-title">${esc(name)}</h2>${technical?`<small>${esc(technical)}</small>`:''}</div><button class="icon-btn" data-close-popup aria-label="关闭">${icon('close')}</button></header>`;}
function showPopup(content){$('popup').innerHTML=content;if(!$('popup').open)$('popup').showModal();}
function details(item){if(!item)return;showPopup(popupHead(item.name,item.technical_name,item.kind==='relation'?'link':item.kind==='value'?'value':'box')+'<div class="dialog-tabs"><span>概览</span><span>属性</span><span>关系</span></div><div class="dialog-placeholder" aria-label="详情内容占位"></div>');}
function addRelation(item){showPopup(popupHead('添加关系','','link')+`<form class="dialog-form" id="relation-form"><label>来源<input value="${esc(item.name)}" readonly></label><label>关系名称<input placeholder="输入关系名称" required maxlength="40" name="name"></label><label>目标对象<select name="target">${objects.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select></label><span class="prototype-note">仅预览，不写入已发布版本</span><button class="btn primary" type="submit">预览</button></form>`);}
let noticeTimer;
function notice(message){clearTimeout(noticeTimer);$('notice').textContent=message;$('notice').hidden=false;noticeTimer=setTimeout(()=>$('notice').hidden=true,3000);}
$('tree').addEventListener('click',e=>{const group=e.target.closest('[data-group]'),item=e.target.closest('[data-select]'),menu=e.target.closest('[data-item-menu]');if(group){const id=group.dataset.group;if(state.closed.has(id))state.closed.delete(id);else state.closed.add(id);renderTree();$('tree').querySelector(`[data-group="${id}"]`).focus();}if(item)select(item.dataset.select);if(menu)openMenu(menu.dataset.itemMenu,menu);});
$('tree').addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key))return;const choices=[...$('tree').querySelectorAll('button.group-heading,button.item-select')].filter(b=>!b.closest('[hidden]'));const at=choices.indexOf(document.activeElement);if(at<0)return;e.preventDefault();choices[e.key==='Home'?0:e.key==='End'?choices.length-1:(at+(e.key==='ArrowDown'?1:-1)+choices.length)%choices.length]?.focus();});
$('filter').addEventListener('input',()=>{closeMenu();state.query=$('filter').value.trim();state.closed.clear();renderTree();});
$('clear-filter').addEventListener('click',()=>{state.query='';$('filter').value='';renderTree();$('filter').focus();});
$('collapse').addEventListener('click',()=>{closeMenu();setCollapsed(!state.collapsed);});
$('rail-search').addEventListener('click',()=>{setCollapsed(false);$('filter').focus();});
$('context-menu').addEventListener('click',e=>{const b=e.target.closest('[data-menu]');if(!b)return;const item=menuItem;closeMenu();if(b.dataset.menu==='detail')details(item);if(b.dataset.menu==='locate')select(item.id,true);if(b.dataset.menu==='add')addRelation(item);});
$('context-menu').addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key))return;e.preventDefault();const bs=[...$('context-menu').querySelectorAll('button')].filter(b=>!b.hidden),i=bs.indexOf(document.activeElement);bs[e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length]?.focus();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#context-menu,[data-item-menu]'))closeMenu();});
$('tree').addEventListener('scroll',()=>closeMenu(),{passive:true,capture:true});
$('popup').addEventListener('click',e=>{if(e.target.closest('[data-close-popup]'))$('popup').close();if(e.target===$('popup')){const r=$('popup').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('popup').close();}});
$('popup').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='relation-form'){const form=new FormData(e.target);showPopup(popupHead(form.get('name'),'','link')+`<div class="dialog-body">${esc(e.target.querySelector('input[readonly]').value)} → ${esc(nameOf(form.get('target')))}<br><span class="prototype-note">关系预览 · 未写入已发布版本</span></div>`);}});
$('selection-detail').addEventListener('click',()=>details(allMap.get(state.selection)));
$('clear-selection').addEventListener('click',clearSelection);
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>showPopup(popupHead(b.dataset.action,'',b.dataset.action==='发布'?'rocket':b.dataset.action==='导入'?'upload':b.dataset.action==='导出'?'download':'spark')+'<div class="dialog-body">此操作为原型占位。</div>')));
$('global-switch').addEventListener('click',()=>notice('全局视图为应用导航占位'));
$('semantic-switch').addEventListener('click',()=>{if(state.selection)clearSelection();});
function zoomBy(factor,px,py){const r=$('canvas').getBoundingClientRect();px??=r.width/2;py??=r.height/2;const next=Math.max(.12,Math.min(2.4,state.scale*factor));state.x=px-(px-state.x)*next/state.scale;state.y=py-(py-state.y)*next/state.scale;state.scale=next;applyTransform();}
$('zoom-in').addEventListener('click',()=>zoomBy(1.2));$('zoom-out').addEventListener('click',()=>zoomBy(1/1.2));$('fit').addEventListener('click',fit);
$('graph').addEventListener('wheel',e=>{e.preventDefault();const r=$('graph').getBoundingClientRect();zoomBy(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null,suppressClick=false;
$('graph').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('[data-node],[data-edge]'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:state.x,startY:state.y,moved:false};$('graph').setPointerCapture(e.pointerId);});
$('graph').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.moved=true;state.x=drag.startX+dx;state.y=drag.startY+dy;$('graph').classList.toggle('panning',drag.moved);applyTransform();});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;suppressClick=drag.moved;drag=null;$('graph').classList.remove('panning');}
$('graph').addEventListener('pointerup',endDrag);$('graph').addEventListener('pointercancel',endDrag);
$('graph').addEventListener('click',e=>{if(suppressClick){suppressClick=false;return;}const item=e.target.closest('[data-node],[data-edge]');if(item)select(item.dataset.node||item.dataset.edge,true);else if(state.selection)clearSelection();});
$('graph').addEventListener('dblclick',e=>{const item=e.target.closest('[data-node],[data-edge]');if(item)details(allMap.get(item.dataset.node||item.dataset.edge));});
$('graph').addEventListener('keydown',e=>{const item=e.target.closest('[data-node],[data-edge]');if(item&&['Enter',' '].includes(e.key)){e.preventDefault();select(item.dataset.node||item.dataset.edge,true);requestAnimationFrame(()=>[...$('graph').querySelectorAll('[data-node],[data-edge]')].find(n=>(n.dataset.node||n.dataset.edge)===state.selection)?.focus());}});
$('minimap').addEventListener('click',e=>{const svg=$('minimap').querySelector('svg'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const local=p.matrixTransform(svg.getScreenCTM().inverse()),r=$('canvas').getBoundingClientRect();state.x=r.width/2-local.x*state.scale;state.y=r.height/2-local.y*state.scale;applyTransform();});
$('minimap').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(e.key))return;e.preventDefault();if(e.key==='Enter'){fit();return;}state.x+=e.key==='ArrowLeft'?80:e.key==='ArrowRight'?-80:0;state.y+=e.key==='ArrowUp'?80:e.key==='ArrowDown'?-80:0;applyTransform();});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('popup').open)return;if(!$('context-menu').hidden){closeMenu(true);return;}if(state.selection)clearSelection();else if(state.query){state.query='';$('filter').value='';renderTree();}});
try{const saved=localStorage.getItem('ontofoundry.semantic.explorer.collapsed');state.collapsed=saved===null?innerWidth<700:saved==='true';}catch(_){state.collapsed=innerWidth<700;}
renderTree();renderGraph();setCollapsed(state.collapsed,false);
new ResizeObserver(()=>{closeMenu();if(state.selection)centreSelection();else fit();}).observe($('canvas'));
</script>
</body>
