n| kafka_cluster | Kafka 集群。别名… | Kafka |\n| second_party_library | 组织内部二方软件包。别名… | 二方库 |\n\n- **材料中找不到的 4 个**：`core_service`、`non_core_service`、`private_cfc_config`、`global_cfc_config`（材料里只有它们的父概念 `component`/`cfc_config`，没有对应条目）→ 按你的要求应**保持不变**。\n\n**属性（property）**\n- 当前 65 个，名称是英文技术名（如 `component_name`、`architecture_type`）；材料每个对象的 `properties[]` 都带 `name_zh`/`name_en`。可按 `name_en` 匹配后改为 `name_zh`（如 `component_name → 组件英文名`）。\n\n**关系（link_type）**\n- 这是需要你拍板的点：材料 `object_relations` 里只有 `relation_id` / `relation_kind`（如 `runs_in`、`belongs_to`、`deployed_on`）和 `notes`，**没有关系本身的中文名 `name_zh`**。因此关系的「简洁中文名」材料里没有直接来源。\n\n## 三、需要你确认的 3 个问题\n\n1. **「名称」的范围**：我计划只改 `name`（显示名）字段，保留 `concept`（英文技术概念名，作为稳定 ID）、`technical_name`、`description` 不变。是否符合你的预期？\n2. **关系（link_type）如何处理**：材料没有关系中文名，二选一——\n   - (a) 关系全部**保持不变**（符合“材料找不到对应项就保持”的规则）；\n   - (b) 按 `relation_kind` **翻译**（如 `runs_in→运行于`、`belongs_to→属于`、`deployed_on→部署于`），但这属于脱离材料的推断。\n3. **4 个无材料对应的对象**（`core_service` / `non_core_service` / `private_cfc_config` / `global_cfc_config`）确认保持不变。\n\n确认以上 3 点后，我会在下一轮建模请求中按 `ontofoundry.proposals/v1` 输出这批 `update` 提案（只改 name，`before` 取固定草稿原元素、`expected_target_hash` 取 element_hashes），材料证据逐条落到 `ontology.json` 的具体行号。"},{"id":"msg_92a9f390d42f4be8a40ae85a","role":"user","status":"success","content":"回复你的三个问题：1. 是，只改 name（显示名称），concept、technical_name、description 都不动。2. 关系不需要翻译，全部保持不变。3. 这 4 个在材料中找不到对应项的对象（core_service、non_core_service、private_cfc_config、global_cfc_config）保持不变。请按此输出只改名称的 update 提案。"},{"id":"msg_48fcc15749034bcd9dc1ca95","role":"assistant","status":"finished","content":"已完成提案生成并通过 Schema 校验（`jsonschema.Draft7Validator` 0 错误）。结果写入 `output/ontofoundry-result-33b1a753f272e7f196405bf98dff996a.json`，共 **73 条 update 提案**（25 对象类型 + 48 属性），全部只改 `name`，不改 concept / technical_name / description / 结构。\n\n## 一、对象类型改名（25 条）\n\n按 `concept` 与材料 `object_types[].id` 一一对应，`name` 改为 `name_zh`：\n\n| concept | 新 name | concept | 新 name |\n|---|---|---|---|\n| component | 组件 | second_party_library | 二方库 |\n| microservice_component | 微服务组件 | maven_third_party_library | Maven三方库 |\n| graded_assurance_component | 分级保障组件 | host | 主机 |\n| graded_assurance_microservice_component | 分级保障微服务 | deployment_cluster | 部署集群 |\n| system | 系统 | zone | 区域 |\n| department | 部门 | environment | 环境 |\n| api_interface | 接口 | kafka_cluster | Kafka |\n| arch_rule | 架构规范 | kafka_topic | Kafka Topic |\n| arch_issue | 架构问题 | redis_instance | Redis |\n| architecture_risk | 架构风险 | redis_db | Redis DB |\n| optimization_suggestion | 优化建议 | database_instance | 数据库 |\n| cfc_config | CFC配置 | database_schema | 数据库 Schema |\n| table_asset | 表 | | |\n\n## 二、属性改名（48 条）\n\n按「所属对象 concept + 属性 `name_en` == 草稿 `technical_name`」精确匹配，`name` 改为材料 `name_zh`。例如：`component_name→组件英文名`、`system_name→系统英文名`、`rule_key→规则英文名`、`hostname→主机名`、`database_ip→数据库IP`、`table_name→表名` 等。\n\n## 三、保持不变的元素（按你的三条确认口径）\n\n1. **4 个对象类型**（材料无对应项）：`core_service`、`non_core_service`、`private_cfc_config`、`global_cfc_config`。\n2. **关系（link_type）全部不变**（材料未提供关系中文名，且你确认不翻译）。\n3. **规则（rule）不变**（不在本次「对象/关系/属性」范围内）。\n4. **17 个属性不变**——材料 `name_en` 与草稿 `technical_name` 不一致或缺失，无法确立一一对应：\n   - 属于 4 个无材料对象：`config_file`、`config_key`、`config_environment`、`config_value`、`created_at`、`updated_at`（private_cfc_config）、`config_key`（global_cfc_config）；\n   - 语义相近但 `name_en` 不同或材料无此字段：`business_importance_label`、`is_core`（component）、`display_name`（system）、`introduced_at`、`resolved_at`（arch_issue）、`package_version`（second_party_library）、`package_name`（maven_third_party_library）、`partition_count`、`replica_count`（kafka_topic）、`database_number`（redis_db）。\n\n## 四、证据与合规说明\n\n- 每条提案 `before` 为上下文固定草稿中的原元素（含 id），`expected_target_hash` 取自 `element_hashes`；`after` 为去 id 的完整元素、仅 `name` 变更并追加一条 `kind=material` 证据。\n- 证据 `material_id`/`material_sha256` 取自材料 `49797103-…-ontology.json`，`locator` 指向该行 `name_zh` 原文，`quote` 为原行文字（已核验 73 条引用与文件行逐字一致）。\n- 未使用任何 `kind=manual` 证据；未新增/删除元素；关系、规则、value_type 均未产生提案。\n\n[查看结果文件](output/ontofoundry-result-33b1a753f272e7f   }, outcome === 'answer' ? 950 : 1650);
}
function sendMessage() {
  const text = $('input').value.trim(); if(!text || busy) return;
  const continuation = waiting, forced = chip || !!continuation?.forced;
  if(continuation) {
    const pending = messages.findLast(m => m.type === 'waiting' && !m.resolved); if(pending) pending.resolved = true;
  }
  pushMessage({role:'user',text,forced}); $('input').value = '';
  $('session-label').textContent = '当前本体（v1）· 名称调整'; $('saved').textContent = '当前页面已保存';
  const modeling = forced || !!continuation || classify(text);
  let outcome = 'answer';
  if(modeling) {
    if(/无法生成|无依据|没有依据|不存在的材料|无对应材料/.test(text)) outcome = 'failure';
    else if(!continuation && (/完善|帮我建模|先确认|先澄清/.test(text) || !selectedMaterials.size || (forced && !classify(text)))) outcome = 'clarify';
    else outcome = 'proposals';
  }
  startRun({text,forced,modeling},outcome);
}
function setPanel(value) {
  panel = value;
  document.querySelectorAll('[data-panel]').forEach(b => { const active = b.dataset.panel === value; b.classList.toggle('active',active); b.setAttribute('aria-selected',String(active)); });
  for(const name of ['proposals','draft','graph']) $(`${name}-panel`).hidden = name !== value;
  if(value === 'draft') renderDraft(); if(value === 'graph') renderGraph();
}
const kindNames = {object_type:'实体',property:'属性'};
function technical(item) { return item.after.technical_name || item.after.concept || item.display_name; }
function visibleProposals() {
  const needle = $('proposal-search').value.trim().toLowerCase(), kind = $('kind-filter').value;
  return proposals.filter(p => p.status === statusFilter && (kind === 'all' || p.target_kind === kind) && (!needle || [p.display_name,technical(p),p.before.name,p.owner_label].join(' ').toLowerCase().includes(needle)));
}
function renderProposals() {
  $('proposal-empty').hidden = !!proposals.length; $('proposal-content').hidden = !proposals.length;
  $('proposal-count').hidden = !proposals.length; $('proposal-count').textContent = proposals.filter(p => p.status === 'pending').length;
  for(const status of ['pending','accepted','rejected']) $(`${status}-count`).textContent = proposals.filter(p=>p.status===status).length;
  document.querySelectorAll('[data-status]').forEach(b => b.setAttribute('aria-selected',String(b.dataset.status === statusFilter)));
  const visible = visibleProposals();
  $('proposal-list').innerHTML = visible.length ? visible.map(p => {
    const change = p.field_changes.find(c => c.path === 'name');
    return `<article class="proposal-row ${selectedProposals.has(p.id)?'is-selected':''}" data-row="${esc(p.id)}" tabindex="0" aria-label="${esc(p.display_name)}，按 Enter 查看详情"><input class="row-check" type="checkbox" data-select="${esc(p.id)}" ${selectedProposals.has(p.id)?'checked':''} aria-label="选择 ${esc(p.display_name)}"><div class="row-identity"><span class="kind ${esc(p.target_kind)}">${kindNames[p.target_kind]} ·</span><code class="technical" title="${esc(technical(p))}">${esc(technical(p))}</code><span class="op">修改</span>${p.status !== 'pending'?`<span class="state ${p.status}">${p.status==='accepted'?'已接受':'已拒绝'}</span>`:''}<button class="icon-btn" data-evidence="${esc(p.id)}" aria-label="查看 ${esc(p.display_name)} 的材料证据">${icon('evidence')}</button></div><div class="diff-summary" data-detail="${esc(p.id)}" title="${esc(change.before)} → ${esc(change.after)}"><span class="old-value">${esc(change.before)}</span><span class="diff-arrow">→</span><strong class="new-value">${esc(change.after)}</strong></div><div class="row-actions">${p.status==='pending'?`<button class="btn accept" data-decision="accepted" data-id="${p.id}">接受</button><button class="btn reject" data-decision="rejected" data-id="${p.id}">拒绝</button>`:`<button class="btn reject" data-decision="pending" data-id="${p.id}">恢复</button>`}</div></article>`;
  }).join('') : '<div class="empty"><strong>没有符合条件的提案</strong></div>';
  const pendingCount = proposals.filter(p=>p.status==='pending').length;
  $('accept-all').textContent = `全部接受（${pendingCount}）`; $('accept-all').disabled = !pendingCount;
  const count = selectedProposals.size, visibleSelected = visible.filter(p=>selectedProposals.has(p.id)).length;
  $('selection-label').textContent = count ? `已选 ${count} 项` : '选择当前结果';
  $('select-visible').checked = visible.length > 0 && visibleSelected === visible.length;
  $('select-visible').indeterminate = visibleSelected > 0 && visibleSelected < visible.length;
  $('select-visible').disabled = !visible.length;
  $('accept-all').hidden = !!count;
  for(const name of ['accept-selected','reject-selected','clear-selection']) $(name).hidden = !count;
  $('result-count').textContent = `显示 ${visible.length} / ${proposals.length} 条`;
  renderDraft(); renderGraph();
}
function decide(ids,status) {
  undoSnapshot = structuredClone(proposals); let count = 0;
  for(const p of proposals) if(ids.includes(p.id) && p.status !== status) {p.status = status; selectedProposals.delete(p.id); count++;}
  if(!count) return; renderProposals();
  if($('detail-dialog').open && detailId) openDetail(detailId,false,false);
  toast(`${status==='accepted'?'已接受':status==='rejected'?'已拒绝':'已恢复'} ${count} 条提案`,true);
}
function renderDraft() {
  const rows = REAL_DATA.proposals.map(original => {
    const current = proposals.find(p=>p.id === original.id), accepted = current?.status === 'accepted';
    return `<div class="draft-item">${accepted?'<span class="state accepted">已更新</span>':''}<strong>${esc(accepted?current.after.name:original.before.name)}</strong><code>${kindNames[original.target_kind]} · ${esc(technical(original))}</code></div>`;
  });
  $('draft-items').innerHTML = rows.join('');
}
function graphName(item) {
  const reviewed = proposals.find(p=>p.id===item.id); return reviewed?.status==='accepted' ? reviewed.after.name : item.before.name;
}
function renderGraph() {
  const objects = REAL_DATA.proposals.filter(p=>p.target_kind==='object_type');
  const component = objects.find(p=>p.after.concept==='component'), child = objects.find(p=>p.after.concept==='microservice_component');
  const hasEdge = child.after.extends.some(ref=>ref.ref===component.target_id);
  const name = p => {const n=graphName(p); return esc(n.length>12?n.slice(0,12)+'…':n);};
  $('graph-items').innerHTML = `<svg class="graph" viewBox="0 0 440 490" role="img" aria-label="组件与微服务组件的真实继承关系，其他实体独立展示"><defs><marker id="graph-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#aab5c4" stroke="none"/></marker></defs>${hasEdge?'<path d="M220 166V91" marker-end="url(#graph-arrow)"/><text x="229" y="132" class="edge-label">继承</text>':''}${objects.map((p,index)=>{const positions=[[130,35],[130,166],[22,300],[237,300],[130,405]], [x,y]=positions[index];return `<g><title>${esc(graphName(p))}</title><rect x="${x}" y="${y}" width="180" height="54"/><circle cx="${x+15}" cy="${y+17}" r="5"/><text x="${x+28}" y="${y+22}">${name(p)}</text><text class="subtext" x="${x+12}" y="${y+42}">${esc(technical(p))}</text></g>`;}).join('')}</svg>`;
}
function evidenceMarkup(item) {
  return item.evidence.map(ev => `<article class="evidence-item"><header>${icon('file')}<strong>${esc(ev.material_name)}</strong><span>· 第 ${esc(ev.locator.line_start)}${ev.locator.line_end !== ev.locator.line_start?'–'+esc(ev.locator.line_end):''} 行</span></header><blockquote>${esc(ev.quote)}</blockquote></article>`).join('');
}
function openDetail(id,evidenceOnly = false,show = true) {
  const item = proposals.find(p=>p.id === id); if(!item) return;
  if(show) detailOrigin = document.activeElement;
  detailId = id; $('detail-title').textContent = evidenceOnly ? `材料证据 · ${item.display_name}` : `修改${kindNames[item.target_kind]} · ${item.display_name}`;
  $('detail-technical').textContent = technical(item);
  const changes = item.field_changes.filter(c=>c.path !== 'evidence');
  $('detail-body').innerHTML = `${evidenceOnly?'':`<section><h3>字段差异</h3><table class="diff-table"><thead><tr><th>字段</th><th>修改前</th><th>提案值</th></tr></thead><tbody>${changes.map(c=>`<tr><th>${c.path==='name'?'名称':esc(c.path)}</th><td>${esc(c.before)}</td><td>${esc(c.after)}</td></tr>`).join('')}</tbody></table></section>`}<section><h3>材料证据</h3>${evidenceMarkup(item)}</section>`;
  $('detail-actions').innerHTML = evidenceOnly ? '<button class="btn" data-close-detail>关闭</button>' : item.status==='pending'?`<button class="btn" data-decision="rejected" data-id="${item.id}">拒绝</button><button class="btn primary" data-decision="accepted" data-id="${item.id}">接受</button>`:`<button class="btn" data-decision="pending" data-id="${item.id}">恢复待审</button>`;
  if(show && !$('detail-dialog').open) $('detail-dialog').showModal();
}
function hideInfo() { $('info-popover').hidden = true; if(infoOrigin) infoOrigin.setAttribute('aria-expanded','false'); }
function showInfo(button) {
  const same = infoOrigin === button && !$('info-popover').hidden; hideInfo(); if(same) return;
  infoOrigin = button; button.setAttribute('aria-expanded','true');
  const box = $('info-popover');
  // A tooltip opened inside a modal must share its top-layer ancestor.
  (button.closest('dialog') || document.body).appendChild(box);
  box.textContent = button.dataset.info; box.hidden = false;
  const r=button.getBoundingClientRect(), b=box.getBoundingClientRect();
  box.style.left = `${Math.max(10,Math.min(innerWidth-b.width-10,r.left))}px`;
  box.style.top = `${Math.max(10,r.bottom+b.height+8<innerHeight?r.bottom+7:r.top-b.height-7)}px`;
}
function resetSession() {
  clearTimeout(timer); generation++; busy=false; waiting=null; lastRequest=null; messages=[]; proposals=[];
  selectedMaterials.clear(); selectedProposals.clear(); statusFilter='pending'; undoSnapshot=null;
  $('proposal-search').value=''; $('kind-filter').value='all'; $('input').value=''; $('run-indicator').hidden=true;
  $('preview-scene').value='empty'; $('session-label').textContent='新会话'; $('saved').textContent='尚未开始';
  $('toast').hidden=true; hideInfo(); closeMenu(); setChip(false);
  if($('detail-dialog').open) $('detail-dialog').close(); if($('table-dialog').open) $('table-dialog').close();
  collapsed=false; $('columns').classList.remove('collapsed'); $('reference-summary').hidden=true;
  $('collapse-references').setAttribute('aria-expanded','true'); $('expand-references').setAttribute('aria-expanded','false');
  setMaterialTab('upload'); setPanel('proposals'); renderMessages(); renderProposals(); syncComposer();
}
function previewScene(value) {
  resetSession(); $('preview-scene').value=value; if(value==='empty') return;
  selectedMaterials.add(REAL_DATA.materials[0].id); setMaterialTab('library');
  $('session-label').textContent='当前本体（v1）· 名称调整';
  if(value==='model') {setChip(true); fillInput(originalPrompt);}
  if(value==='answer') {proposals=structuredClone(REAL_DATA.proposals); renderProposals(); fillInput('对象、属性和关系有什么区别？');}
  if(value==='waiting') {
    waiting={forced:true,text:originalPrompt}; lastRequest={text:originalPrompt,forced:true,modeling:true};
    messages=[{role:'user',text:originalPrompt,forced:true},{role:'assistant',type:'waiting'}];
    renderMessages(); fillInput(actualReply);
  }
  if(value==='failure') {
    lastRequest={text:originalPrompt,forced:true,modeling:true};
    messages=[{role:'user',text:originalPrompt,forced:true},{role:'assistant',type:'failure',request:{...lastRequest}}]; renderMessages();
  }
  syncComposer();
}
async function uploadFiles(files) {
  if(busy || waiting) return;
  const allowed=/\.(md|markdown|txt|json|ya?ml|csv)$/i; let count=0;
  for(const file of files) {
    if(!allowed.test(file.name) || file.size>256*1024*1024) {toast('文件格式或大小不符合要求'); continue;}
    try {
      const contents=await file.text();
      const m={id:`local-${Date.now()}-${count}`,name:file.name,byte_size:file.size,chunk_count:Math.max(1,Math.ceil(contents.length/14000)),content:contents};
      materials.unshift(m); selectedMaterials.add(m.id); count++;
    } catch {toast('无法读取文件');}
  }
  if(count) {setMaterialTab('library'); renderMaterials(); toast(`已加入 ${count} 份材料`);}
  $('file-input').value='';
}
$('composer').addEventListener('submit',e=>{e.preventDefault();sendMessage();});
$('input').addEventListener('input',syncComposer);
$('input').addEventListener('keydown',e=>{if(e.key==='Enter' && !e.shiftKey && !e.isComposing){e.preventDefault();sendMessage();}});
$('plus').onclick=()=>{if($('plus-menu').hidden)openMenu();else closeMenu(true);};
$('plus').addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();openMenu();}});
$('choose-model').onclick=()=>{setChip(true);closeMenu();$('input').focus();};
$('remove-chip').onclick=()=>{setChip(false);$('input').focus();announce('已移除本体建模，恢复自动判断');};
$('plus-menu').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeMenu(true);}if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();$('choose-model').focus();}if(e.key==='Tab')closeMenu();});
$('collapse-references').onclick=()=>setCollapsed(true); $('expand-references').onclick=()=>setCollapsed(false);
$('material-list').addEventListener('change',e=>{const id=e.target.dataset.material;if(!id)return;if(e.target.checked)selectedMaterials.add(id);else selectedMaterials.delete(id);renderMaterials();});
$('upload-button').onclick=()=>$('file-input').click();
$('file-input').onchange=()=>uploadFiles(Array.from($('file-input').files));
$('upload-button').addEventListener('dragover',e=>{e.preventDefault();if(!busy&&!waiting)$('upload-button').classList.add('dragging');});

$('upload-button').addEventListener('drop',e=>{e.preventDefault();$('upload-button').classList.remove('dragging');uploadFiles(Array.from(e.dataTransfer.files));});
$('new-connection').onclick=()=>{hideInfo();$('table-dialog').showModal();};
$('close-tables').onclick=$('cancel-tables').onclick=()=>$('table-dialog').close();
$('table-dialog').addEventListener('close',()=>{hideInfo();document.body.appendChild($('info-popover'));});
$('close-detail').onclick=()=>$('detail-dialog').close();

$('proposal-search').oninput=renderProposals; $('kind-filter').onchange=renderProposals;
$('select-visible').onchange=e=>{for(const p of visibleProposals()){if(e.target.checked)selectedProposals.add(p.id);else selectedProposals.delete(p.id);}renderProposals();};
$('accept-all').onclick=()=>decide(proposals.filter(p=>p.status==='pending').map(p=>p.id),'accepted');
$('accept-selected').onclick=()=>decide([...selectedProposals],'accepted');
$('reject-selected').onclick=()=>decide([...selectedProposals],'rejected');
$('clear-selection').onclick=()=>{selectedProposals.clear();renderProposals();};
$('undo-review').onclick=()=>{if(!undoSnapshot)return;proposals=structuredClone(undoSnapshot);undoSnapshot=null;renderProposals();toast('已撤销审核操作');};
$('proposal-list').addEventListener('change',e=>{const id=e.target.dataset.select;if(!id)return;if(e.target.checked)selectedProposals.add(id);else selectedProposals.delete(id);renderProposals();});
$('proposal-list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-row]')){e.preventDefault();openDetail(e.target.dataset.row);}});
$('preview-scene').onchange=e=>previewScene(e.target.value);
$('reset').onclick=$('new-session').onclick=resetSession;
document.addEventListener('click',e=>{
  const info=e.target.closest('[data-info]'); if(info){showInfo(info);return;}
  if(!e.target.closest('#info-popover'))hideInfo();
  if(!e.target.closest('.plus-wrap'))closeMenu();
  const example=e.target.closest('[data-prompt]');if(example){fillInput(examples[example.dataset.prompt]);return;}
  const mt=e.target.closest('[data-material-tab]');if(mt){setMaterialTab(mt.dataset.materialTab);return;}
  const pt=e.target.closest('[data-panel]');if(pt){setPanel(pt.dataset.panel);return;}
  const st=e.target.closest('[data-status]');if(st){statusFilter=st.dataset.status;renderProposals();return;}
  const decision=e.target.closest('[data-decision]');if(decision){decide([decision.dataset.id],decision.dataset.decision);return;}
  const evidence=e.target.closest('[data-evidence]');if(evidence){openDetail(evidence.dataset.evidence,true);return;}
  const detail=e.target.closest('[data-detail]');if(detail){openDetail(detail.dataset.detail);return;}
  if(e.target.closest('[data-close-detail]'))$('detail-dialog').close();
  if(e.target.closest('[data-view-proposals]')){setPanel('proposals');$('tab-proposals').focus();}
  const retry=e.target.closest('[data-retry]');
  if(retry && !busy){const request=messages[Number(retry.dataset.retry)]?.request;if(request)startRun(request,'proposals');}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('info-popover').hidden){e.preventDefault();e.stopPropagation();hideInfo();infoOrigin?.focus();}
  const group=e.target.closest('[role=tablist]');
  if(group && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
    const tabs=[...group.querySelectorAll('[role=tab]')],i=tabs.indexOf(e.target);if(i<0)return;e.preventDefault();
    const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
    tabs[next].click();tabs[next].focus();
  }
},true);
window.addEventListener('resize',()=>{hideInfo();closeMenu();});
resetSession();
